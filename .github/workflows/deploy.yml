name: Deploy Furry Art Discord App (DeviantArt RSS)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: furry-art-user-app-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate application files
        shell: bash
        run: |
          mkdir -p src scripts

          cat > package.json <<'PACKAGE_EOF'
          {
            "name": "furry-art-discord-user-app",
            "version": "4.0.0",
            "private": true,
            "type": "module",
            "description": "A user-installed Discord app that searches filtered furry artwork through DeviantArt public RSS.",
            "scripts": {
              "check": "node --check src/index.js && node --check scripts/register-commands.js",
              "deploy": "wrangler deploy",
              "register": "node scripts/register-commands.js"
            },
            "dependencies": {
              "discord-interactions": "4.4.0"
            },
            "devDependencies": {
              "wrangler": "4.114.0"
            },
            "engines": {
              "node": ">=22"
            }
          }
          PACKAGE_EOF

          cat > wrangler.jsonc <<'WRANGLER_EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "furry-art-finder-app",
            "main": "src/index.js",
            "compatibility_date": "2026-08-02",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "durable_objects": {
              "bindings": [
                {
                  "name": "DEVIANTART_TOKEN_VAULT",
                  "class_name": "DeviantArtTokenVault"
                }
              ]
            },
            "exports": {
              "DeviantArtTokenVault": {
                "type": "durable-object",
                "storage": "sqlite"
              }
            },
            "observability": {
              "enabled": true,
              "logs": {
                "invocation_logs": true,
                "head_sampling_rate": 1
              }
            }
          }
          WRANGLER_EOF

          cat > src/index.js <<'WORKER_EOF'
          import { verifyKey } from "discord-interactions";
          
          const INTERACTION = Object.freeze({
            PING: 1,
            APPLICATION_COMMAND: 2,
            MESSAGE_COMPONENT: 3,
          });
          
          const RESPONSE = Object.freeze({
            PONG: 1,
            CHANNEL_MESSAGE_WITH_SOURCE: 4,
            UPDATE_MESSAGE: 7,
          });
          
          const EPHEMERAL = 1 << 6;
          const RSS_URL = "https://backend.deviantart.com/rss.xml";
          const USER_AGENT =
            "ShiftFurrySearch/4.0 (Discord user app; DeviantArt public RSS reader)";
          
          const STOP_WORDS = new Set([
            "a", "an", "and", "art", "artwork", "drawing", "furry", "for",
            "from", "in", "of", "on", "picture", "please", "show", "the",
            "to", "with",
          ]);
          
          const BLOCKED_WORDS = new Set([
            "adult", "explicit", "fetish", "naked", "nude", "nsfw", "porn",
            "pornographic", "sex", "sexual", "yiff",
          ]);
          
          // RSS has no trustworthy structured mature-content flag, so this is a
          // deliberately conservative best-effort filter over titles, descriptions,
          // categories and URLs.
          const UNSAFE_RESULT_PATTERN = new RegExp(
            String.raw`\b(adult|explicit|fetish|naked|nudity|nude|nsfw|porn|pornographic|sex|sexual|sexy|yiff|18\+|mature content|gore|guro|vore|inflation|pregnant|pregnancy|diaper|feet fetish|bondage|bdsm)\b`,
            "i",
          );
          
          function json(data, status = 200) {
            return new Response(JSON.stringify(data), {
              status,
              headers: {
                "content-type": "application/json; charset=UTF-8",
                "cache-control": "no-store",
              },
            });
          }
          
          function ephemeralMessage(content) {
            return json({
              type: RESPONSE.CHANNEL_MESSAGE_WITH_SOURCE,
              data: { content, flags: EPHEMERAL },
            });
          }
          
          function cleanText(value, maxLength) {
            return String(value ?? "")
              .replace(/[\u0000-\u001F\u007F]/g, " ")
              .replace(/\s+/g, " ")
              .trim()
              .slice(0, maxLength);
          }
          
          function tokenizeQuery(input) {
            const raw = cleanText(input, 80).toLowerCase();
            if (!raw) return { terms: [], blocked: false };
          
            const pieces = raw.match(/"[^"]+"|'[^']+'|\S+/g) ?? [];
            const terms = [];
            let blocked = false;
          
            for (const piece of pieces) {
              const withoutQuotes = piece.replace(/^['"]|['"]$/g, "");
              const normalized = withoutQuotes
                .normalize("NFKD")
                .replace(/[^a-z0-9 _-]/g, "")
                .replace(/[-_\s]+/g, " ")
                .trim()
                .slice(0, 35);
          
              if (!normalized) continue;
              const words = normalized.split(/\s+/);
              if (words.some((word) => BLOCKED_WORDS.has(word))) {
                blocked = true;
                continue;
              }
          
              if (STOP_WORDS.has(normalized)) continue;
              terms.push(normalized);
            }
          
            return { terms: [...new Set(terms)].slice(0, 6), blocked };
          }
          
          function decodeXmlEntities(value) {
            return String(value ?? "")
              .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, "$1")
              .replace(/&#x([0-9a-f]+);/gi, (_, hex) => {
                const codePoint = Number.parseInt(hex, 16);
                return Number.isFinite(codePoint) ? String.fromCodePoint(codePoint) : _;
              })
              .replace(/&#(\d+);/g, (_, decimal) => {
                const codePoint = Number.parseInt(decimal, 10);
                return Number.isFinite(codePoint) ? String.fromCodePoint(codePoint) : _;
              })
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&amp;/g, "&");
          }
          
          function stripHtml(value) {
            return cleanText(
              decodeXmlEntities(value)
                .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, " ")
                .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, " ")
                .replace(/<[^>]+>/g, " "),
              1000,
            );
          }
          
          function extractTag(block, tagName) {
            const escaped = tagName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const match = block.match(new RegExp(`<${escaped}(?:\\s[^>]*)?>([\\s\\S]*?)<\\/${escaped}>`, "i"));
            return match ? decodeXmlEntities(match[1]).trim() : "";
          }
          
          function extractAllTags(block, tagName) {
            const escaped = tagName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const regex = new RegExp(`<${escaped}(?:\\s[^>]*)?>([\\s\\S]*?)<\\/${escaped}>`, "gi");
            const values = [];
            for (const match of block.matchAll(regex)) {
              values.push(stripHtml(match[1]));
            }
            return values.filter(Boolean);
          }
          
          function extractAttribute(tag, attributeName) {
            const escaped = attributeName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const match = tag.match(new RegExp(`\\b${escaped}\\s*=\\s*(["'])([\\s\\S]*?)\\1`, "i"));
            return match ? decodeXmlEntities(match[2]).trim() : "";
          }
          
          function collectAttributeUrls(block, tagName, attributeName) {
            const escapedTag = tagName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const regex = new RegExp(`<${escapedTag}\\b[^>]*>`, "gi");
            const urls = [];
            for (const match of block.matchAll(regex)) {
              const value = extractAttribute(match[0], attributeName);
              if (value) urls.push(value);
            }
            return urls;
          }
          
          function isHttpsUrl(value) {
            if (typeof value !== "string" || !value.startsWith("https://")) return false;
            try {
              return new URL(value).protocol === "https:";
            } catch {
              return false;
            }
          }
          
          function isDeviantArtPage(value) {
            if (!isHttpsUrl(value)) return false;
            try {
              const hostname = new URL(value).hostname.toLowerCase();
              return hostname === "deviantart.com" || hostname === "www.deviantart.com" || hostname.endsWith(".deviantart.com");
            } catch {
              return false;
            }
          }
          
          function creatorFromSourceUrl(sourceUrl) {
            try {
              const url = new URL(sourceUrl);
              const first = url.pathname.split("/").filter(Boolean)[0];
              if (first && !["art", "deviation", "gallery", "tag"].includes(first.toLowerCase())) {
                return first;
              }
            } catch {}
            return "Unknown artist";
          }
          
          function parseRssItems(xml) {
            const items = [];
            const itemRegex = /<item\b[^>]*>([\s\S]*?)<\/item>/gi;
          
            for (const match of xml.matchAll(itemRegex)) {
              const block = match[1];
              const title = stripHtml(extractTag(block, "title")) || "DeviantArt artwork";
              const sourceUrl = extractTag(block, "link") || extractTag(block, "guid");
              const descriptionRaw = extractTag(block, "description");
              const description = stripHtml(descriptionRaw);
              const categories = [
                ...extractAllTags(block, "category"),
                ...extractAllTags(block, "media:category"),
              ];
          
              const decodedDescription = decodeXmlEntities(descriptionRaw);
              const imageCandidates = [
                ...collectAttributeUrls(block, "media:content", "url"),
                ...collectAttributeUrls(block, "media:thumbnail", "url"),
                ...collectAttributeUrls(block, "enclosure", "url"),
                ...collectAttributeUrls(decodedDescription, "img", "src"),
              ].filter(isHttpsUrl);
          
              const creator = cleanText(
                extractTag(block, "media:credit") ||
                extractTag(block, "dc:creator") ||
                creatorFromSourceUrl(sourceUrl),
                100,
              ) || "Unknown artist";
          
              const published = cleanText(extractTag(block, "pubDate"), 100);
              const imageUrl = imageCandidates[0] ?? null;
              const safetyText = `${title} ${description} ${categories.join(" ")} ${sourceUrl} ${imageUrl}`;
          
              if (!isDeviantArtPage(sourceUrl)) continue;
              if (!imageUrl) continue;
              if (UNSAFE_RESULT_PATTERN.test(safetyText)) continue;
          
              items.push({
                title: cleanText(title, 200),
                sourceUrl,
                imageUrl,
                creator,
                description: cleanText(description, 350),
                categories: categories.slice(0, 20),
                published,
              });
            }
          
            return items;
          }
          
          function buildFeedUrl(searchExpression, offset = 0) {
            const url = new URL(RSS_URL);
            url.searchParams.set("type", "deviation");
            url.searchParams.set("q", searchExpression);
            url.searchParams.set("offset", String(offset));
            url.searchParams.set("mature_content", "false");
            return url;
          }
          
          function rssSearches(terms) {
            const text = terms.join(" ");
            return [
              {
                label: "newest",
                url: buildFeedUrl(`sort:time furry ${text} meta:all`.trim(), 0),
              },
              {
                label: "popular-week",
                url: buildFeedUrl(`boost:popular max_age:168h furry ${text} meta:all`.trim(), 0),
              },
            ];
          }
          
          async function requestRssFeed(search) {
            let response;
            try {
              response = await fetch(search.url, {
                headers: {
                  accept: "application/rss+xml, application/xml;q=0.9, text/xml;q=0.8, */*;q=0.1",
                  "user-agent": USER_AGENT,
                },
                redirect: "follow",
                signal: AbortSignal.timeout(2300),
              });
            } catch (error) {
              const wrapped = new Error(`DeviantArt RSS ${search.label} request failed: ${error?.message ?? error}`);
              wrapped.status = 0;
              wrapped.label = search.label;
              throw wrapped;
            }
          
            const body = await response.text();
            if (!response.ok) {
              console.error(
                "DeviantArt RSS request failed",
                search.label,
                response.status,
                response.headers.get("content-type"),
                body.slice(0, 300),
              );
              const error = new Error(`DeviantArt RSS returned HTTP ${response.status}`);
              error.status = response.status;
              error.label = search.label;
              error.bodyPreview = body.slice(0, 180);
              throw error;
            }
          
            if (!/<(?:rss|rdf:RDF)\b/i.test(body)) {
              console.error("DeviantArt RSS returned non-feed content", search.label, body.slice(0, 300));
              const error = new Error("DeviantArt RSS returned an invalid feed");
              error.status = response.status;
              error.label = search.label;
              error.bodyPreview = body.slice(0, 180);
              throw error;
            }
          
            return {
              label: search.label,
              status: response.status,
              contentType: response.headers.get("content-type"),
              body,
              items: parseRssItems(body),
            };
          }
          
          function itemIdentity(item) {
            return `${item.sourceUrl}\n${item.imageUrl}`;
          }
          
          function rankArtwork(item, terms) {
            const haystack = `${item.title} ${item.description} ${item.categories.join(" ")}`.toLowerCase();
            let score = Math.random() * 2;
            for (const term of terms) {
              const normalized = term.toLowerCase();
              if (item.title.toLowerCase().includes(normalized)) score += 8;
              if (haystack.includes(normalized)) score += 3;
            }
            return score;
          }
          
          async function findArtwork(terms) {
            const searches = rssSearches(terms);
            const settled = await Promise.allSettled(searches.map(requestRssFeed));
            const collected = new Map();
            const errors = [];
          
            for (const result of settled) {
              if (result.status === "fulfilled") {
                for (const item of result.value.items) {
                  collected.set(itemIdentity(item), item);
                }
              } else {
                errors.push(result.reason);
              }
            }
          
            const usable = [...collected.values()];
            if (usable.length > 0) {
              usable.sort((a, b) => rankArtwork(b, terms) - rankArtwork(a, terms));
              const candidatePool = usable.slice(0, Math.min(12, usable.length));
              return candidatePool[Math.floor(Math.random() * candidatePool.length)];
            }
          
            if (errors.length === settled.length) {
              throw errors[0] ?? new Error("All DeviantArt RSS requests failed");
            }
          
            return null;
          }
          
          function buildArtworkMessage(item, terms) {
            const searchText = terms.join(" ");
            const encodedTerms = encodeURIComponent(searchText).slice(0, 78);
            const fields = [
              {
                name: "Artist",
                value: item.creator,
                inline: true,
              },
              {
                name: "Credit & source",
                value: `[Open on DeviantArt](${item.sourceUrl})`,
                inline: false,
              },
            ];
          
            if (item.published) {
              fields.splice(1, 0, {
                name: "Published",
                value: cleanText(item.published, 100),
                inline: true,
              });
            }
          
            return {
              embeds: [
                {
                  title: item.title || "DeviantArt artwork",
                  url: item.sourceUrl,
                  description: `Search: \`${cleanText(searchText, 80)}\``,
                  fields,
                  image: { url: item.imageUrl },
                  footer: {
                    text: "DeviantArt public RSS • best-effort mature filtering",
                  },
                },
              ],
              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      style: 1,
                      custom_id: `another:${encodedTerms}`,
                      label: "Another result",
                      emoji: { name: "🔄" },
                    },
                    {
                      type: 2,
                      style: 5,
                      url: item.sourceUrl,
                      label: "Open post",
                    },
                  ],
                },
              ],
              allowed_mentions: { parse: [] },
            };
          }
          
          async function searchAndBuild(terms) {
            const item = await findArtwork(terms);
            if (!item) return null;
            return buildArtworkMessage(item, terms);
          }
          
          async function handleCommand(interaction) {
            if (interaction?.data?.name !== "furry") {
              return ephemeralMessage("Unknown command.");
            }
          
            const queryOption = interaction?.data?.options?.find((option) => option.name === "query");
            const query = String(queryOption?.value ?? "");
            const { terms, blocked } = tokenizeQuery(query);
          
            if (blocked) {
              return ephemeralMessage(
                "This app only searches for filtered artwork. Try `blue wolf forest` instead.",
              );
            }
          
            if (terms.length === 0) {
              return ephemeralMessage(
                "Give me useful search words, such as `cute fox`, `dragon armor`, or `blue wolf forest`.",
              );
            }
          
            try {
              const message = await searchAndBuild(terms);
              if (!message) {
                return ephemeralMessage(
                  `No filtered DeviantArt RSS result was found for \`${cleanText(terms.join(" "), 80)}\`. Try fewer or simpler words.`,
                );
              }
          
              return json({
                type: RESPONSE.CHANNEL_MESSAGE_WITH_SOURCE,
                data: message,
              });
            } catch (error) {
              console.error("Artwork RSS search failed", error);
              const status = Number(error?.status ?? 0);
              if (status === 403) {
                return ephemeralMessage(
                  "DeviantArt blocked its RSS feed from this server. Open `/debug/rss` in the Worker URL to confirm the response.",
                );
              }
              if (status === 429) {
                return ephemeralMessage("DeviantArt is temporarily rate-limiting its RSS feed. Try again shortly.");
              }
              return ephemeralMessage("DeviantArt RSS did not respond correctly. Please try again shortly.");
            }
          }
          
          async function handleComponent(interaction) {
            const customId = String(interaction?.data?.custom_id ?? "");
            if (!customId.startsWith("another:")) {
              return ephemeralMessage("Unknown button.");
            }
          
            let decoded = "";
            try {
              decoded = decodeURIComponent(customId.slice("another:".length));
            } catch {
              decoded = "";
            }
          
            const terms = decoded.split(/\s+/).filter(Boolean).slice(0, 6);
            if (terms.length === 0) {
              return ephemeralMessage("The saved search was invalid. Run `/furry` again.");
            }
          
            try {
              const message = await searchAndBuild(terms);
              if (!message) {
                return ephemeralMessage("No other filtered DeviantArt RSS result was found for that search.");
              }
          
              return json({
                type: RESPONSE.UPDATE_MESSAGE,
                data: message,
              });
            } catch (error) {
              console.error("Artwork RSS refresh failed", error);
              return ephemeralMessage("DeviantArt RSS did not respond correctly. Please try again shortly.");
            }
          }
          
          async function runRssDiagnostics(request) {
            const url = new URL(request.url);
            const requested = cleanText(url.searchParams.get("q") ?? "blue wolf", 80);
            const { terms } = tokenizeQuery(requested);
            const safeTerms = terms.length > 0 ? terms : ["blue", "wolf"];
            const searches = rssSearches(safeTerms);
            const report = {
              ok: false,
              generated_at: new Date().toISOString(),
              source: "DeviantArt public RSS",
              query: safeTerms.join(" "),
              tests: [],
            };
          
            const settled = await Promise.allSettled(searches.map(requestRssFeed));
            for (let index = 0; index < settled.length; index += 1) {
              const result = settled[index];
              const search = searches[index];
              if (result.status === "fulfilled") {
                report.tests.push({
                  name: search.label,
                  ok: true,
                  status: result.value.status,
                  content_type: result.value.contentType,
                  parsed_items: result.value.items.length,
                  sample_titles: result.value.items.slice(0, 3).map((item) => item.title),
                  feed_url: search.url.toString(),
                });
              } else {
                report.tests.push({
                  name: search.label,
                  ok: false,
                  status: Number(result.reason?.status ?? 0),
                  error: cleanText(result.reason?.message ?? result.reason, 200),
                  body_preview: cleanText(result.reason?.bodyPreview ?? "", 180) || undefined,
                  feed_url: search.url.toString(),
                });
              }
            }
          
            report.ok = report.tests.some((test) => test.ok && test.parsed_items > 0);
            return report;
          }
          
          // Kept only so replacing the previous Durable Object deployment does not need
          // a destructive migration. The RSS build does not read or write this object.
          export class DeviantArtTokenVault {
            constructor(state, env) {
              this.state = state;
              this.env = env;
            }
          
            async fetch() {
              return json({ ok: true, unused: true, source: "DeviantArt RSS build" });
            }
          }
          
          export default {
            async fetch(request, env) {
              const requestUrl = new URL(request.url);
          
              if (request.method === "GET" && requestUrl.pathname === "/debug/rss") {
                return json(await runRssDiagnostics(request));
              }
          
              if (request.method === "GET") {
                return new Response(
                  "Furry Art Finder is online and using DeviantArt public RSS. Open /debug/rss?q=blue%20wolf to test the feed.",
                  { headers: { "content-type": "text/plain; charset=UTF-8" } },
                );
              }
          
              if (request.method !== "POST") {
                return new Response("Method Not Allowed", { status: 405 });
              }
          
              if (!env.DISCORD_PUBLIC_KEY) {
                console.error("DISCORD_PUBLIC_KEY is not configured");
                return new Response("Server is not configured", { status: 500 });
              }
          
              const signature = request.headers.get("x-signature-ed25519");
              const timestamp = request.headers.get("x-signature-timestamp");
              const rawBody = await request.text();
          
              if (!signature || !timestamp) {
                return new Response("Missing Discord signature", { status: 401 });
              }
          
              const valid = await verifyKey(rawBody, signature, timestamp, env.DISCORD_PUBLIC_KEY);
              if (!valid) {
                return new Response("Invalid request signature", { status: 401 });
              }
          
              let interaction;
              try {
                interaction = JSON.parse(rawBody);
              } catch {
                return new Response("Invalid JSON", { status: 400 });
              }
          
              if (interaction.type === INTERACTION.PING) {
                return json({ type: RESPONSE.PONG });
              }
          
              if (interaction.type === INTERACTION.APPLICATION_COMMAND) {
                return handleCommand(interaction);
              }
          
              if (interaction.type === INTERACTION.MESSAGE_COMPONENT) {
                return handleComponent(interaction);
              }
          
              return ephemeralMessage("Unsupported Discord interaction.");
            },
          };
          WORKER_EOF

          cat > scripts/register-commands.js <<'REGISTER_EOF'
          const applicationId = process.env.DISCORD_APPLICATION_ID;
          const botToken = process.env.DISCORD_BOT_TOKEN;
          const legacyGuildId = process.env.DISCORD_GUILD_ID?.trim();
          
          if (!applicationId || !botToken) {
            console.error(
              "Missing DISCORD_APPLICATION_ID or DISCORD_BOT_TOKEN. Add them as GitHub Actions secrets.",
            );
            process.exit(1);
          }
          
          const commands = [
            {
              name: "furry",
              type: 1,
              description: "Find filtered furry artwork from DeviantArt public RSS",
              nsfw: false,
              integration_types: [1],
              contexts: [0, 1, 2],
              options: [
                {
                  type: 3,
                  name: "query",
                  description: "Example: blue wolf forest, cute fox, or dragon armor",
                  required: true,
                  min_length: 2,
                  max_length: 80,
                },
              ],
            },
          ];
          
          async function putCommands(endpoint, commandList) {
            const response = await fetch(endpoint, {
              method: "PUT",
              headers: {
                Authorization: `Bot ${botToken}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(commandList),
            });
          
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`Discord command registration failed (${response.status}): ${body}`);
            }
          }
          
          try {
            await putCommands(
              `https://discord.com/api/v10/applications/${applicationId}/commands`,
              commands,
            );
            console.log("Registered /furry globally for User Install with DeviantArt RSS.");
          
            if (legacyGuildId) {
              await putCommands(
                `https://discord.com/api/v10/applications/${applicationId}/guilds/${legacyGuildId}/commands`,
                [],
              );
              console.log(`Removed legacy guild commands from ${legacyGuildId}.`);
            }
          } catch (error) {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          }
          REGISTER_EOF

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: npm run check

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Add Discord public key to Worker
        shell: bash
        run: printf '%s' "$DISCORD_PUBLIC_KEY" | npx wrangler secret put DISCORD_PUBLIC_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}

      - name: Register user-installed slash command
        run: npm run register
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
