name: Deploy Furry Art Discord App (DeviantArt)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: furry-art-user-app-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate application files
        shell: bash
        run: |
          mkdir -p src scripts

          cat > package.json <<'PACKAGE_EOF'
          {
            "name": "furry-art-discord-user-app",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "description": "A user-installed Discord app for searching non-mature furry artwork on DeviantArt from DMs, group DMs, and servers.",
            "scripts": {
              "check": "node --check src/index.js && node --check scripts/register-commands.js",
              "dev": "wrangler dev",
              "deploy": "wrangler deploy",
              "register": "node scripts/register-commands.js"
            },
            "dependencies": {
              "discord-interactions": "4.4.0"
            },
            "devDependencies": {
              "wrangler": "4.114.0"
            },
            "engines": {
              "node": ">=22"
            }
          }
          PACKAGE_EOF

          cat > wrangler.jsonc <<'WRANGLER_EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "furry-art-finder-app",
            "main": "src/index.js",
            "compatibility_date": "2026-08-02",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "observability": {
              "enabled": true
            }
          }
          WRANGLER_EOF

          cat > src/index.js <<'WORKER_EOF'
          import { verifyKey } from "discord-interactions";
          
          const INTERACTION = Object.freeze({
            PING: 1,
            APPLICATION_COMMAND: 2,
            MESSAGE_COMPONENT: 3,
          });
          
          const RESPONSE = Object.freeze({
            PONG: 1,
            CHANNEL_MESSAGE_WITH_SOURCE: 4,
            UPDATE_MESSAGE: 7,
          });
          
          const EPHEMERAL = 1 << 6;
          const DEVIANTART_TOKEN_URL = "https://www.deviantart.com/oauth2/token";
          const DEVIANTART_SEARCH_ENDPOINTS = [
            "https://www.deviantart.com/api/v1/oauth2/browse/newest",
            "https://www.deviantart.com/api/v1/oauth2/browse/popular",
          ];
          const USER_AGENT =
            "ShiftFurrySearch/2.0 (by Fahir56 on GitHub; non-mature art search)";

          let cachedDeviantArtToken = null;
          let cachedDeviantArtTokenExpiresAt = 0;
          
          const STOP_WORDS = new Set([
            "a",
            "an",
            "and",
            "art",
            "artwork",
            "drawing",
            "furry",
            "for",
            "from",
            "in",
            "of",
            "on",
            "picture",
            "please",
            "show",
            "the",
            "to",
            "with",
          ]);
          
          const BLOCKED_WORDS = new Set([
            "adult",
            "explicit",
            "fetish",
            "naked",
            "nude",
            "nsfw",
            "porn",
            "pornographic",
            "sex",
            "sexual",
            "yiff",
          ]);
          
          const FUR_COLORS = new Set([
            "black",
            "blue",
            "brown",
            "cyan",
            "gray",
            "green",
            "grey",
            "orange",
            "pink",
            "purple",
            "red",
            "tan",
            "teal",
            "white",
            "yellow",
          ]);
          
          function json(data, status = 200) {
            return new Response(JSON.stringify(data), {
              status,
              headers: {
                "content-type": "application/json; charset=UTF-8",
                "cache-control": "no-store",
              },
            });
          }
          
          function ephemeralMessage(content) {
            return json({
              type: RESPONSE.CHANNEL_MESSAGE_WITH_SOURCE,
              data: { content, flags: EPHEMERAL },
            });
          }
          
          function cleanText(value, maxLength) {
            return String(value ?? "")
              .replace(/[\u0000-\u001F\u007F]/g, " ")
              .replace(/\s+/g, " ")
              .trim()
              .slice(0, maxLength);
          }
          
          function tokenizeQuery(input) {
            const raw = cleanText(input, 60).toLowerCase();
            if (!raw) return { tags: [], blocked: false };
          
            const pieces = raw.match(/"[^"]+"|'[^']+'|\S+/g) ?? [];
            const tokens = [];
            let blocked = false;
          
            for (const piece of pieces) {
              const withoutQuotes = piece.replace(/^['"]|['"]$/g, "");
              const normalized = withoutQuotes
                .normalize("NFKD")
                .replace(/[^a-z0-9 _-]/g, "")
                .replace(/[-\s]+/g, "_")
                .replace(/^_+|_+$/g, "")
                .slice(0, 30);
          
              if (!normalized) continue;
          
              const words = normalized.split("_");
              if (words.some((word) => BLOCKED_WORDS.has(word))) {
                blocked = true;
                continue;
              }
          
              if (STOP_WORDS.has(normalized)) continue;
              tokens.push(normalized);
            }
          
            const unique = [...new Set(tokens)];

            // DeviantArt accepts a normal text query. Keep enough words to preserve
            // the user's description while preventing very long search strings.
            return { tags: unique.slice(0, 5), blocked };
          }
          
          function normalizeSearchTerms(tags) {
            return tags
              .map((tag) => tag.replaceAll("_", " "))
              .filter(Boolean)
              .join(" ");
          }

          function imageUrlFor(deviation) {
            const candidates = [
              deviation?.content?.src,
              deviation?.thumbs?.find((thumb) => Number(thumb?.height ?? 0) >= 400)?.src,
              deviation?.thumbs?.at?.(-1)?.src,
            ];
            return candidates.find(
              (value) => typeof value === "string" && value.startsWith("https://"),
            );
          }

          function isDisplayableArtwork(deviation) {
            return (
              deviation?.is_mature === false &&
              deviation?.is_deleted !== true &&
              Boolean(imageUrlFor(deviation)) &&
              typeof deviation?.url === "string" &&
              deviation.url.startsWith("https://")
            );
          }

          async function getDeviantArtToken(env) {
            const now = Date.now();
            if (cachedDeviantArtToken && now < cachedDeviantArtTokenExpiresAt) {
              return cachedDeviantArtToken;
            }

            if (!env.DEVIANTART_CLIENT_ID || !env.DEVIANTART_CLIENT_SECRET) {
              throw new Error(
                "DEVIANTART_CLIENT_ID or DEVIANTART_CLIENT_SECRET is not configured",
              );
            }

            const form = new URLSearchParams({
              grant_type: "client_credentials",
              client_id: env.DEVIANTART_CLIENT_ID,
              client_secret: env.DEVIANTART_CLIENT_SECRET,
            });

            const response = await fetch(DEVIANTART_TOKEN_URL, {
              method: "POST",
              headers: {
                accept: "application/json",
                "content-type": "application/x-www-form-urlencoded",
                "user-agent": USER_AGENT,
              },
              body: form.toString(),
            });

            const body = await response.text();
            if (!response.ok) {
              console.error(
                "DeviantArt token request failed",
                response.status,
                response.headers.get("content-type"),
                body.slice(0, 300),
              );
              throw new Error(`DeviantArt token request returned HTTP ${response.status}`);
            }

            let payload;
            try {
              payload = JSON.parse(body);
            } catch {
              console.error("DeviantArt token response was not JSON", body.slice(0, 300));
              throw new Error("DeviantArt token response was invalid");
            }

            if (typeof payload?.access_token !== "string") {
              console.error("DeviantArt token response had no access_token", payload);
              throw new Error("DeviantArt token response had no access token");
            }

            const expiresInSeconds = Math.max(60, Number(payload?.expires_in ?? 3600));
            cachedDeviantArtToken = payload.access_token;
            cachedDeviantArtTokenExpiresAt =
              now + Math.max(60, expiresInSeconds - 120) * 1000;
            return cachedDeviantArtToken;
          }

          function sleep(milliseconds) {
            return new Promise((resolve) => setTimeout(resolve, milliseconds));
          }

          async function requestDeviantArtSearch(endpoint, token, query) {
            const url = new URL(endpoint);
            url.searchParams.set("q", query);
            url.searchParams.set("limit", "40");
            url.searchParams.set("offset", "0");
            url.searchParams.set("mature_content", "0");
            url.searchParams.set("with_session", "0");

            if (endpoint.endsWith("/popular")) {
              url.searchParams.set("timerange", "alltime");
            }

            for (let attempt = 1; attempt <= 2; attempt += 1) {
              const response = await fetch(url, {
                headers: {
                  accept: "application/json",
                  "accept-encoding": "gzip, br",
                  authorization: `Bearer ${token}`,
                  "user-agent": USER_AGENT,
                },
              });

              const body = await response.text();
              if (response.ok) {
                try {
                  return JSON.parse(body);
                } catch {
                  console.error(
                    "DeviantArt returned non-JSON",
                    endpoint,
                    response.headers.get("content-type"),
                    body.slice(0, 300),
                  );
                  throw new Error("Artwork source returned invalid JSON");
                }
              }

              console.error(
                "DeviantArt search attempt failed",
                endpoint,
                `attempt=${attempt}`,
                `status=${response.status}`,
                response.headers.get("content-type"),
                body.slice(0, 300),
              );

              const retryable = [429, 500, 502, 503, 504].includes(response.status);
              if (!retryable || attempt === 2) {
                const error = new Error(`Artwork source returned HTTP ${response.status}`);
                error.status = response.status;
                throw error;
              }

              await sleep(150 * attempt);
            }

            throw new Error("DeviantArt search failed without a response");
          }

          async function findArtwork(tags, env) {
            const token = await getDeviantArtToken(env);
            const terms = normalizeSearchTerms(tags);
            const query = `furry ${terms}`.trim();
            let lastError = null;

            for (const endpoint of DEVIANTART_SEARCH_ENDPOINTS) {
              try {
                const payload = await requestDeviantArtSearch(endpoint, token, query);
                const results = Array.isArray(payload?.results) ? payload.results : [];
                const usable = results.filter(isDisplayableArtwork);

                if (usable.length > 0) {
                  return usable[Math.floor(Math.random() * usable.length)];
                }

                console.warn("DeviantArt endpoint returned no usable images", endpoint, query);
              } catch (error) {
                lastError = error;
                console.error("DeviantArt endpoint failed; trying fallback", endpoint, error);
              }
            }

            if (lastError) throw lastError;
            return null;
          }

          function buildArtworkMessage(deviation, tags) {
            const artistText = cleanText(deviation?.author?.username ?? "Unknown", 100);
            const postUrl = deviation.url;
            const imageUrl = imageUrlFor(deviation);
            const title = cleanText(deviation?.title ?? "Furry artwork", 200);
            const matchedTerms = normalizeSearchTerms(tags);
            const encodedTags = encodeURIComponent(tags.join(" ")).slice(0, 78);

            return {
              embeds: [
                {
                  title: title || "Non-mature furry artwork",
                  url: postUrl,
                  description: `Search: \`${cleanText(matchedTerms, 80)}\``,
                  fields: [
                    {
                      name: "Artist",
                      value: artistText || "Unknown",
                      inline: true,
                    },
                    {
                      name: "Credit & source",
                      value: `[Open on DeviantArt](${postUrl})`,
                      inline: false,
                    },
                  ],
                  image: { url: imageUrl },
                  footer: {
                    text: "Non-mature result from DeviantArt",
                  },
                },
              ],
              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      style: 1,
                      custom_id: `another:${encodedTags}`,
                      label: "Another result",
                      emoji: { name: "🔄" },
                    },
                    {
                      type: 2,
                      style: 5,
                      url: postUrl,
                      label: "Open post",
                    },
                  ],
                },
              ],
              allowed_mentions: { parse: [] },
            };
          }

          async function searchAndBuild(tags, env) {
            const deviation = await findArtwork(tags, env);
            if (!deviation) return null;
            return buildArtworkMessage(deviation, tags);
          }

          async function handleCommand(interaction, env) {
            if (interaction?.data?.name !== "furry") {
              return ephemeralMessage("Unknown command.");
            }
          
            const queryOption = interaction?.data?.options?.find((option) => option.name === "query");
            const query = String(queryOption?.value ?? "");
            const { tags, blocked } = tokenizeQuery(query);
          
            if (blocked) {
              return ephemeralMessage(
                "This bot only searches for safe artwork. Try a non-explicit description such as `blue wolf forest`.",
              );
            }
          
            if (tags.length === 0) {
              return ephemeralMessage(
                "Give me one or two useful words, such as `cute fox`, `dragon armor`, or `blue wolf forest`.",
              );
            }
          
            try {
              const message = await searchAndBuild(tags, env);
              if (!message) {
                return ephemeralMessage(
                  `No safe image result was found for \`${cleanText(tags.join(" "), 80)}\`. Try fewer or simpler words.`,
                );
              }
          
              return json({
                type: RESPONSE.CHANNEL_MESSAGE_WITH_SOURCE,
                data: message,
              });
            } catch (error) {
              console.error("Artwork search failed", error);
              const status = Number(error?.status ?? 0);
              if (status >= 500) {
                return ephemeralMessage(
                  "DeviantArt is returning a temporary server error. The bot tried both search endpoints; please try again in a minute.",
                );
              }
              return ephemeralMessage("The artwork source did not respond correctly. Please try again shortly.");
            }
          }
          
          async function handleComponent(interaction, env) {
            const customId = String(interaction?.data?.custom_id ?? "");
            if (!customId.startsWith("another:")) {
              return ephemeralMessage("Unknown button.");
            }
          
            let decoded;
            try {
              decoded = decodeURIComponent(customId.slice("another:".length));
            } catch {
              decoded = "";
            }
          
            const tags = decoded.split(/\s+/).filter(Boolean).slice(0, 2);
            if (tags.length === 0) {
              return ephemeralMessage("The saved search was invalid. Run `/furry` again.");
            }
          
            try {
              const message = await searchAndBuild(tags, env);
              if (!message) {
                return ephemeralMessage("No other safe result was found for that search.");
              }
          
              return json({
                type: RESPONSE.UPDATE_MESSAGE,
                data: message,
              });
            } catch (error) {
              console.error("Artwork refresh failed", error);
              return ephemeralMessage("The artwork source did not respond correctly. Please try again shortly.");
            }
          }
          
          export default {
            async fetch(request, env) {
              if (request.method === "GET") {
                return new Response(
                  "Furry Art Finder user app is online. Discord interactions must use POST requests.",
                  { headers: { "content-type": "text/plain; charset=UTF-8" } },
                );
              }
          
              if (request.method !== "POST") {
                return new Response("Method Not Allowed", { status: 405 });
              }
          
              if (!env.DISCORD_PUBLIC_KEY) {
                console.error("DISCORD_PUBLIC_KEY is not configured");
                return new Response("Server is not configured", { status: 500 });
              }
          
              const signature = request.headers.get("x-signature-ed25519");
              const timestamp = request.headers.get("x-signature-timestamp");
              const rawBody = await request.text();
          
              if (!signature || !timestamp) {
                return new Response("Missing Discord signature", { status: 401 });
              }
          
              const valid = await verifyKey(rawBody, signature, timestamp, env.DISCORD_PUBLIC_KEY);
              if (!valid) {
                return new Response("Invalid request signature", { status: 401 });
              }
          
              let interaction;
              try {
                interaction = JSON.parse(rawBody);
              } catch {
                return new Response("Invalid JSON", { status: 400 });
              }
          
              if (interaction.type === INTERACTION.PING) {
                return json({ type: RESPONSE.PONG });
              }
          
              if (interaction.type === INTERACTION.APPLICATION_COMMAND) {
                return handleCommand(interaction, env);
              }
          
              if (interaction.type === INTERACTION.MESSAGE_COMPONENT) {
                return handleComponent(interaction, env);
              }
          
              return ephemeralMessage("Unsupported Discord interaction.");
            },
          };
          WORKER_EOF

          cat > scripts/register-commands.js <<'REGISTER_EOF'
          const applicationId = process.env.DISCORD_APPLICATION_ID;
          const botToken = process.env.DISCORD_BOT_TOKEN;
          const legacyGuildId = process.env.DISCORD_GUILD_ID?.trim();
          
          if (!applicationId || !botToken) {
            console.error(
              "Missing DISCORD_APPLICATION_ID or DISCORD_BOT_TOKEN. Add them as GitHub Actions secrets.",
            );
            process.exit(1);
          }
          
          const commands = [
            {
              name: "furry",
              type: 1,
              description: "Find safe furry artwork from any DM, group DM, or server",
              nsfw: false,
          
              // USER_INSTALL: the app is installed to a person's Discord account,
              // rather than being added as a member of a server.
              integration_types: [1],
          
              // GUILD, BOT_DM, PRIVATE_CHANNEL. PRIVATE_CHANNEL covers normal DMs
              // and group DMs where the app itself is not a participant.
              contexts: [0, 1, 2],
          
              options: [
                {
                  type: 3,
                  name: "query",
                  description: "Example: blue wolf forest, cute fox, or dragon armor",
                  required: true,
                  min_length: 2,
                  max_length: 60,
                },
              ],
            },
          ];
          
          async function putCommands(endpoint, commandList) {
            const response = await fetch(endpoint, {
              method: "PUT",
              headers: {
                Authorization: `Bot ${botToken}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(commandList),
            });
          
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`Discord command registration failed (${response.status}): ${body}`);
            }
          
            return body;
          }
          
          try {
            // User-install commands must be global commands.
            await putCommands(
              `https://discord.com/api/v10/applications/${applicationId}/commands`,
              commands,
            );
            console.log(
              "Registered /furry globally for User Install in servers, bot DMs, normal DMs, and group DMs.",
            );
          
            // If the old project had DISCORD_GUILD_ID configured, remove its obsolete
            // server-scoped command so Discord does not show two copies while testing.
            if (legacyGuildId) {
              await putCommands(
                `https://discord.com/api/v10/applications/${applicationId}/guilds/${legacyGuildId}/commands`,
                [],
              );
              console.log(`Removed legacy guild commands from ${legacyGuildId}.`);
            }
          } catch (error) {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          }
          REGISTER_EOF

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: npm run check

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Add Discord public key to Worker
        shell: bash
        run: printf '%s' "$DISCORD_PUBLIC_KEY" | npx wrangler secret put DISCORD_PUBLIC_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}

      - name: Add DeviantArt client ID to Worker
        shell: bash
        run: printf '%s' "$DEVIANTART_CLIENT_ID" | npx wrangler secret put DEVIANTART_CLIENT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEVIANTART_CLIENT_ID: ${{ secrets.DEVIANTART_CLIENT_ID }}

      - name: Add DeviantArt client secret to Worker
        shell: bash
        run: printf '%s' "$DEVIANTART_CLIENT_SECRET" | npx wrangler secret put DEVIANTART_CLIENT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEVIANTART_CLIENT_SECRET: ${{ secrets.DEVIANTART_CLIENT_SECRET }}

      - name: Register user-installed slash command
        run: npm run register
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          
