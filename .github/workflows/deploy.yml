name: Deploy Shift Furry Bot (Safe + NSFW)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: shift-furry-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate application files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p api lib scripts
          cat > package.json <<'__PACKAGE_JSON_EOF__'
          {
            "name": "shift-furry-safe-nsfw",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "description": "Discord user-installed furry image search with separate safe and age-restricted commands.",
            "scripts": {
              "check": "node --check api/interactions.js && node --check api/health.js && node --check api/status.js && node --check lib/e6.js && node --check scripts/configure-discord.js",
              "configure-discord": "node scripts/configure-discord.js"
            },
            "dependencies": {
              "@vercel/functions": "latest",
              "discord-interactions": "4.4.0"
            },
            "devDependencies": {
              "vercel": "latest"
            },
            "engines": {
              "node": ">=22"
            }
          }
          __PACKAGE_JSON_EOF__
          cat > vercel.json <<'__VERCEL_JSON_EOF__'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "regions": [
              "iad1"
            ],
            "functions": {
              "api/*.js": {
                "maxDuration": 60
              }
            },
            "rewrites": [
              {
                "source": "/",
                "destination": "/api/status"
              },
              {
                "source": "/health",
                "destination": "/api/health"
              }
            ]
          }
          __VERCEL_JSON_EOF__
          cat > api/interactions.js <<'__API_INTERACTIONS_JS_EOF__'
          import { waitUntil } from "@vercel/functions";
          import { verifyKey } from "discord-interactions";
          import {
            buildArtworkMessage,
            cleanText,
            decodeButtonData,
            findArtwork,
            parseQuery,
          } from "../lib/e6.js";
          
          const INTERACTION = Object.freeze({
            PING: 1,
            APPLICATION_COMMAND: 2,
            MESSAGE_COMPONENT: 3,
          });
          
          const RESPONSE = Object.freeze({
            PONG: 1,
            CHANNEL_MESSAGE_WITH_SOURCE: 4,
            DEFERRED_CHANNEL_MESSAGE_WITH_SOURCE: 5,
            DEFERRED_UPDATE_MESSAGE: 6,
          });
          
          const EPHEMERAL = 1 << 6;
          
          function json(data, status = 200) {
            return new Response(JSON.stringify(data), {
              status,
              headers: {
                "content-type": "application/json; charset=UTF-8",
                "cache-control": "no-store",
              },
            });
          }
          
          function immediateEphemeral(content) {
            return json({
              type: RESPONSE.CHANNEL_MESSAGE_WITH_SOURCE,
              data: {
                content,
                flags: EPHEMERAL,
                allowed_mentions: { parse: [] },
              },
            });
          }
          
          async function editOriginalResponse(interaction, message) {
            const appId = interaction.application_id;
            const token = interaction.token;
            const response = await fetch(
              `https://discord.com/api/v10/webhooks/${appId}/${token}/messages/@original`,
              {
                method: "PATCH",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(message),
              },
            );
          
            if (!response.ok) {
              const body = await response.text();
              throw new Error(
                `Discord response edit failed (${response.status}): ${body.slice(0, 300)}`,
              );
            }
          }
          
          function errorMessage(error) {
            const status = Number(error?.status ?? 0);
            if (status === 403) {
              return "The artwork site blocked this host. Open `/health` on the deployed URL to see which source failed.";
            }
            if (status === 429) {
              return "The artwork site is rate-limiting requests. Wait a moment and try again.";
            }
            return "The artwork source did not respond correctly. Try again shortly.";
          }
          
          async function finishSearch(interaction, mode, tags) {
            try {
              const post = await findArtwork(mode, tags);
              const message = post
                ? buildArtworkMessage(post, mode, tags)
                : {
                    content:
                      `No ${mode === "nsfw" ? "age-restricted" : "safe"} result was found for ` +
                      `\`${cleanText(tags.join(" ").replaceAll("_", " "), 80)}\`. Try fewer tags.`,
                    embeds: [],
                    components: [],
                    allowed_mentions: { parse: [] },
                  };
              await editOriginalResponse(interaction, message);
            } catch (error) {
              console.error("Artwork search failed", error);
              try {
                await editOriginalResponse(interaction, {
                  content: errorMessage(error),
                  embeds: [],
                  components: [],
                  allowed_mentions: { parse: [] },
                });
              } catch (editError) {
                console.error("Could not edit deferred Discord response", editError);
              }
            }
          }
          
          function commandMode(name) {
            if (name === "furry") return "safe";
            if (name === "furry-nsfw") return "nsfw";
            return null;
          }
          
          export default {
            async fetch(request) {
              if (request.method === "GET") {
                return json({
                  ok: true,
                  service: "Shift's Furry Search",
                  commands: ["/furry", "/furry-nsfw"],
                  endpoint: "/api/interactions",
                });
              }
          
              if (request.method !== "POST") {
                return new Response("Method Not Allowed", { status: 405 });
              }
          
              const publicKey = process.env.DISCORD_PUBLIC_KEY;
              if (!publicKey) {
                console.error("DISCORD_PUBLIC_KEY is not configured");
                return new Response("Server is not configured", { status: 500 });
              }
          
              const signature = request.headers.get("x-signature-ed25519");
              const timestamp = request.headers.get("x-signature-timestamp");
              const rawBody = await request.text();
          
              if (!signature || !timestamp) {
                return new Response("Missing Discord signature", { status: 401 });
              }
          
              const valid = await verifyKey(rawBody, signature, timestamp, publicKey);
              if (!valid) {
                return new Response("Invalid request signature", { status: 401 });
              }
          
              let interaction;
              try {
                interaction = JSON.parse(rawBody);
              } catch {
                return new Response("Invalid JSON", { status: 400 });
              }
          
              if (interaction.type === INTERACTION.PING) {
                return json({ type: RESPONSE.PONG });
              }
          
              if (interaction.type === INTERACTION.APPLICATION_COMMAND) {
                const mode = commandMode(interaction?.data?.name);
                if (!mode) return immediateEphemeral("Unknown command.");
          
                const queryOption = interaction?.data?.options?.find(
                  (option) => option.name === "query",
                );
                const parsed = parseQuery(queryOption?.value ?? "");
          
                if (parsed.blocked) {
                  const reason = parsed.reason === "underage"
                    ? "Underage-related searches are never allowed."
                    : "Search operators such as `rating:` and `order:` are controlled by the app.";
                  return immediateEphemeral(reason);
                }
                if (parsed.tags.length === 0) {
                  return immediateEphemeral(
                    "Give me useful tags, such as `blue wolf`, `dragon armor`, or `fox forest`.",
                  );
                }
          
                waitUntil(finishSearch(interaction, mode, parsed.tags));
                return json({
                  type: RESPONSE.DEFERRED_CHANNEL_MESSAGE_WITH_SOURCE,
                  data: { flags: EPHEMERAL },
                });
              }
          
              if (interaction.type === INTERACTION.MESSAGE_COMPONENT) {
                const decoded = decodeButtonData(interaction?.data?.custom_id);
                if (!decoded) {
                  return immediateEphemeral("That saved search is invalid. Run the slash command again.");
                }
          
                waitUntil(finishSearch(interaction, decoded.mode, decoded.tags));
                return json({ type: RESPONSE.DEFERRED_UPDATE_MESSAGE });
              }
          
              return immediateEphemeral("Unsupported Discord interaction.");
            },
          };
          __API_INTERACTIONS_JS_EOF__
          cat > api/health.js <<'__API_HEALTH_JS_EOF__'
          import { diagnostics } from "../lib/e6.js";
          
          export default {
            async fetch(request) {
              const url = new URL(request.url);
              const report = await diagnostics(url.searchParams.get("q") ?? "blue wolf");
              return new Response(JSON.stringify(report), {
                status: report.ok ? 200 : 502,
                headers: {
                  "content-type": "application/json; charset=UTF-8",
                  "cache-control": "no-store",
                },
              });
            },
          };
          __API_HEALTH_JS_EOF__
          cat > api/status.js <<'__API_STATUS_JS_EOF__'
          export default {
            fetch() {
              return new Response(
                "Shift's Furry Search is online. Safe: /furry. Age-restricted: /furry-nsfw. Source check: /health?q=blue%20wolf",
                {
                  headers: {
                    "content-type": "text/plain; charset=UTF-8",
                    "cache-control": "no-store",
                  },
                },
              );
            },
          };
          __API_STATUS_JS_EOF__
          cat > lib/e6.js <<'__LIB_E6_JS_EOF__'
          const SAFE_API = "https://e926.net/posts.json";
          const NSFW_API = "https://e621.net/posts.json";
          const USER_AGENT =
            "ShiftFurrySearch/7.0 (Discord user app; source code on github.com/Fahir56/Shift-s-Furry-Bot)";
          
          const MAX_QUERY_LENGTH = 55;
          const CACHE_TTL_MS = 45_000;
          const cache = new Map();
          
          const STOP_WORDS = new Set([
            "a", "an", "and", "art", "artwork", "drawing", "furry", "for", "from",
            "in", "of", "on", "picture", "please", "show", "the", "to", "with",
          ]);
          
          const DISALLOWED_QUERY_PREFIXES = [
            "rating:", "order:", "status:", "id:", "user:", "approver:", "uploader:",
            "parent:", "child:", "pool:", "set:", "md5:", "source:", "date:", "score:",
            "favcount:", "comment_count:", "note_count:", "width:", "height:", "filesize:",
            "duration:", "ratio:", "limit:",
          ];
          
          const UNDERAGE_WORDS = new Set([
            "cub", "cubs", "child", "children", "kid", "kids", "minor", "minors",
            "underage", "young", "youth", "teen", "teenager", "teenagers", "loli",
            "lolicon", "shota", "shotacon", "aged_down", "age_regression",
          ]);
          
          const UNDERAGE_NEGATIVE_TAGS = [
            "-cub", "-young", "-underage", "-child", "-minor", "-loli", "-shota",
            "-teenager", "-aged_down", "-age_regression",
          ];
          
          const RESULT_UNDERAGE_TAGS = new Set([
            "cub", "young", "underage", "child", "minor", "loli", "shota", "teenager",
            "aged_down", "age_regression",
          ]);
          
          function cleanText(value, maxLength = 200) {
            return String(value ?? "")
              .replace(/[\u0000-\u001F\u007F]/g, " ")
              .replace(/\s+/g, " ")
              .trim()
              .slice(0, maxLength);
          }
          
          function normalizePiece(value) {
            return String(value ?? "")
              .normalize("NFKD")
              .toLowerCase()
              .replace(/[^a-z0-9_()\-:]/g, "")
              .replace(/_{2,}/g, "_")
              .slice(0, 40);
          }
          
          export function parseQuery(input) {
            const raw = cleanText(input, MAX_QUERY_LENGTH);
            if (!raw) return { tags: [], display: "", blocked: false, reason: "empty" };
          
            const pieces = raw.split(/\s+/).map(normalizePiece).filter(Boolean);
            const tags = [];
            let blocked = false;
            let reason = "";
          
            for (const piece of pieces) {
              const unsigned = piece.replace(/^-+/, "");
              if (
                DISALLOWED_QUERY_PREFIXES.some((prefix) => unsigned.startsWith(prefix)) ||
                UNDERAGE_WORDS.has(unsigned)
              ) {
                blocked = true;
                reason = UNDERAGE_WORDS.has(unsigned) ? "underage" : "meta";
                continue;
              }
          
              if (STOP_WORDS.has(unsigned)) continue;
              if (piece === "-" || piece.length < 2) continue;
              tags.push(piece.replace(/^-+/, ""));
            }
          
            const unique = [...new Set(tags)].slice(0, 8);
            return {
              tags: unique,
              display: unique.join(" ").replaceAll("_", " "),
              blocked,
              reason,
            };
          }
          
          function getAllPostTags(post) {
            const groups = post?.tags && typeof post.tags === "object"
              ? Object.values(post.tags)
              : [];
            return groups.flatMap((group) => Array.isArray(group) ? group : []);
          }
          
          function hasUnderageTags(post) {
            return getAllPostTags(post).some((tag) =>
              RESULT_UNDERAGE_TAGS.has(String(tag).toLowerCase())
            );
          }
          
          function usableImageUrl(post) {
            const candidates = [post?.file?.url, post?.sample?.url, post?.preview?.url];
            for (const value of candidates) {
              if (typeof value !== "string" || !value.startsWith("https://")) continue;
              let pathname = "";
              try {
                pathname = new URL(value).pathname.toLowerCase();
              } catch {
                continue;
              }
              if (/\.(jpe?g|png|gif|webp)$/i.test(pathname)) return value;
            }
            return null;
          }
          
          function postIsUsable(post, mode) {
            if (!post || hasUnderageTags(post) || post?.flags?.deleted === true) return false;
            const rating = String(post?.rating ?? "").toLowerCase();
            if (mode === "safe" && rating !== "s") return false;
            if (mode === "nsfw" && !["q", "e"].includes(rating)) return false;
            return Boolean(usableImageUrl(post));
          }
          
          function cacheKey(mode, tags, page) {
            return `${mode}|${page}|${tags.join(" ")}`;
          }
          
          function readCache(key) {
            const hit = cache.get(key);
            if (!hit) return null;
            if (Date.now() - hit.savedAt > CACHE_TTL_MS) {
              cache.delete(key);
              return null;
            }
            return hit.payload;
          }
          
          function writeCache(key, payload) {
            cache.set(key, { savedAt: Date.now(), payload });
            if (cache.size > 100) {
              const oldest = cache.keys().next().value;
              cache.delete(oldest);
            }
          }
          
          async function fetchJson(url) {
            const response = await fetch(url, {
              headers: {
                accept: "application/json",
                "user-agent": USER_AGENT,
              },
            });
            const body = await response.text();
          
            if (!response.ok) {
              const error = new Error(`Artwork API returned HTTP ${response.status}`);
              error.status = response.status;
              error.bodyPreview = body.slice(0, 250);
              throw error;
            }
          
            try {
              return JSON.parse(body);
            } catch {
              const error = new Error("Artwork API returned invalid JSON");
              error.status = 502;
              error.bodyPreview = body.slice(0, 250);
              throw error;
            }
          }
          
          async function requestPosts(mode, tags, page) {
            const endpoint = mode === "safe" ? SAFE_API : NSFW_API;
            const enforcedRating = mode === "safe" ? "rating:safe" : "-rating:safe";
            const queryTags = [
              ...tags,
              enforcedRating,
              ...UNDERAGE_NEGATIVE_TAGS,
            ];
          
            const url = new URL(endpoint);
            url.searchParams.set("tags", queryTags.join(" "));
            url.searchParams.set("limit", "75");
            url.searchParams.set("page", String(page));
          
            const key = cacheKey(mode, queryTags, page);
            const cached = readCache(key);
            if (cached) return cached;
          
            const payload = await fetchJson(url);
            writeCache(key, payload);
            return payload;
          }
          
          export async function findArtwork(mode, tags) {
            const firstPage = 1 + Math.floor(Math.random() * 4);
            const pages = firstPage === 1 ? [1] : [firstPage, 1];
            let lastError = null;
          
            for (const page of pages) {
              try {
                const payload = await requestPosts(mode, tags, page);
                const posts = Array.isArray(payload?.posts) ? payload.posts : [];
                const usable = posts.filter((post) => postIsUsable(post, mode));
                if (usable.length > 0) {
                  return usable[Math.floor(Math.random() * usable.length)];
                }
              } catch (error) {
                lastError = error;
                if (![403, 429, 500, 502, 503, 504].includes(Number(error?.status ?? 0))) {
                  throw error;
                }
              }
            }
          
            if (lastError) throw lastError;
            return null;
          }
          
          function ratingName(rating) {
            return { s: "Safe", q: "Questionable", e: "Explicit" }[
              String(rating ?? "").toLowerCase()
            ] ?? "Unknown";
          }
          
          function firstExternalSource(post) {
            const sources = Array.isArray(post?.sources) ? post.sources : [];
            return sources.find((source) => {
              if (typeof source !== "string" || !source.startsWith("https://")) return false;
              try {
                const hostname = new URL(source).hostname.toLowerCase();
                return !hostname.endsWith("e621.net") && !hostname.endsWith("e926.net");
              } catch {
                return false;
              }
            }) ?? null;
          }
          
          function artistText(post) {
            const artists = Array.isArray(post?.tags?.artist) ? post.tags.artist : [];
            const meaningful = artists
              .filter((artist) => !["conditional_dnp", "unknown_artist"].includes(artist))
              .slice(0, 4)
              .map((artist) => artist.replaceAll("_", " "));
            return meaningful.length ? meaningful.join(", ") : "Unknown artist";
          }
          
          function scoreText(post) {
            const score = Number(post?.score?.total ?? 0);
            const favorites = Number(post?.fav_count ?? 0);
            return `Score ${score} • ${favorites} favorites`;
          }
          
          function encodeButtonData(mode, tags) {
            const modeCode = mode === "nsfw" ? "n" : "s";
            const query = tags.join(" ").slice(0, MAX_QUERY_LENGTH);
            return `another:${modeCode}:${encodeURIComponent(query)}`.slice(0, 100);
          }
          
          export function buildArtworkMessage(post, mode, tags) {
            const host = mode === "safe" ? "e926.net" : "e621.net";
            const postUrl = `https://${host}/posts/${post.id}`;
            const imageUrl = usableImageUrl(post);
            const source = firstExternalSource(post);
            const displayQuery = cleanText(tags.join(" ").replaceAll("_", " "), 80);
            const rating = ratingName(post?.rating);
            const title = `${mode === "nsfw" ? "Age-restricted" : "Safe"} furry artwork #${post.id}`;
          
            const fields = [
              { name: "Artist", value: artistText(post), inline: true },
              { name: "Rating", value: rating, inline: true },
              { name: "Stats", value: scoreText(post), inline: true },
              { name: "Search", value: `\`${displayQuery}\``, inline: false },
            ];
            if (source) {
              fields.push({
                name: "Artist/source link",
                value: `[Open external source](${source})`,
                inline: false,
              });
            }
          
            return {
              content: "",
              embeds: [{
                title,
                url: postUrl,
                fields,
                image: { url: imageUrl },
                footer: {
                  text: mode === "nsfw"
                    ? "Age-restricted result from e621 • Underage-tag filters enforced"
                    : "Safe-rated result from e926",
                },
              }],
              components: [{
                type: 1,
                components: [
                  {
                    type: 2,
                    style: 1,
                    custom_id: encodeButtonData(mode, tags),
                    label: "Another result",
                    emoji: { name: "🔄" },
                  },
                  {
                    type: 2,
                    style: 5,
                    url: postUrl,
                    label: "Open post",
                  },
                ],
              }],
              allowed_mentions: { parse: [] },
            };
          }
          
          export function decodeButtonData(customId) {
            const match = /^another:([sn]):(.{1,80})$/.exec(String(customId ?? ""));
            if (!match) return null;
          
            let decoded = "";
            try {
              decoded = decodeURIComponent(match[2]);
            } catch {
              return null;
            }
          
            const parsed = parseQuery(decoded);
            if (parsed.blocked || parsed.tags.length === 0) return null;
            return { mode: match[1] === "n" ? "nsfw" : "safe", tags: parsed.tags };
          }
          
          export async function diagnostics(query = "blue wolf") {
            const parsed = parseQuery(query);
            const tests = [];
          
            for (const mode of ["safe", "nsfw"]) {
              const endpoint = mode === "safe" ? SAFE_API : NSFW_API;
              const url = new URL(endpoint);
              url.searchParams.set(
                "tags",
                [
                  ...(parsed.tags.length ? parsed.tags : ["wolf"]),
                  mode === "safe" ? "rating:safe" : "-rating:safe",
                  ...UNDERAGE_NEGATIVE_TAGS,
                ].join(" "),
              );
              url.searchParams.set("limit", "5");
          
              try {
                const payload = await fetchJson(url);
                const posts = Array.isArray(payload?.posts) ? payload.posts : [];
                const usableCount = posts.filter((post) => postIsUsable(post, mode)).length;
                tests.push({
                  mode,
                  ok: true,
                  status: 200,
                  returned_posts: posts.length,
                  usable_posts: usableCount,
                  endpoint: new URL(endpoint).hostname,
                });
              } catch (error) {
                tests.push({
                  mode,
                  ok: false,
                  status: Number(error?.status ?? 0),
                  error: error instanceof Error ? error.message : String(error),
                  body_preview: cleanText(error?.bodyPreview ?? "", 250),
                  endpoint: new URL(endpoint).hostname,
                });
              }
            }
          
            return {
              ok: tests.every((test) => test.ok),
              generated_at: new Date().toISOString(),
              query: parsed.display || "wolf",
              tests,
            };
          }
          
          export { cleanText };
          __LIB_E6_JS_EOF__
          cat > scripts/configure-discord.js <<'__SCRIPTS_CONFIGURE_DISCORD_JS_EOF__'
          const applicationId = process.env.DISCORD_APPLICATION_ID;
          const botToken = process.env.DISCORD_BOT_TOKEN;
          const interactionsEndpointUrl = process.env.INTERACTIONS_ENDPOINT_URL;
          
          if (!applicationId || !botToken || !interactionsEndpointUrl) {
            console.error(
              "Missing DISCORD_APPLICATION_ID, DISCORD_BOT_TOKEN, or INTERACTIONS_ENDPOINT_URL.",
            );
            process.exit(1);
          }
          
          const queryOption = {
            type: 3,
            name: "query",
            description: "Tags such as blue wolf, fox forest, or dragon armor",
            required: true,
            min_length: 2,
            max_length: 55,
          };
          
          const commands = [
            {
              name: "furry",
              type: 1,
              description: "Find safe furry artwork",
              nsfw: false,
              integration_types: [1],
              contexts: [0, 1, 2],
              options: [queryOption],
            },
            {
              name: "furry-nsfw",
              type: 1,
              description: "Find age-restricted furry artwork (18+)",
              nsfw: true,
              integration_types: [1],
              contexts: [0, 1, 2],
              options: [queryOption],
            },
          ];
          
          async function discordRequest(path, options) {
            const response = await fetch(`https://discord.com/api/v10${path}`, {
              ...options,
              headers: {
                Authorization: `Bot ${botToken}`,
                "content-type": "application/json",
                ...(options?.headers ?? {}),
              },
            });
          
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`Discord API ${path} failed (${response.status}): ${body}`);
            }
            return body ? JSON.parse(body) : null;
          }
          
          try {
            await discordRequest("/applications/@me", {
              method: "PATCH",
              body: JSON.stringify({
                interactions_endpoint_url: interactionsEndpointUrl,
              }),
            });
            console.log("Updated Discord Interactions Endpoint URL.");
          
            await discordRequest(`/applications/${applicationId}/commands`, {
              method: "PUT",
              body: JSON.stringify(commands),
            });
            console.log("Registered /furry and /furry-nsfw globally for User Install.");
          } catch (error) {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          }
          __SCRIPTS_CONFIGURE_DISCORD_JS_EOF__
          cat > README.md <<'__README_MD_EOF__'
          # Shift's Furry Search — safe + NSFW commands
          
          A Discord **user-installed** app with two commands:
          
          - `/furry query:...` uses **e926** and only accepts safe-rated results.
          - `/furry-nsfw query:...` uses **e621**, is registered with Discord's `nsfw: true` field, and only accepts questionable/explicit results.
          
          Both commands reject underage-related search terms and returned posts tagged with common underage indicators.
          
          ## Why two commands instead of one toggle?
          
          Discord marks age restriction on the whole command. Keeping a separate `/furry-nsfw` command lets `/furry` remain visible as a normal safe command while Discord applies its 18+ restrictions to the other command.
          
          ## Required GitHub Actions secrets
          
          - `DISCORD_APPLICATION_ID`
          - `DISCORD_PUBLIC_KEY`
          - `DISCORD_BOT_TOKEN`
          - `VERCEL_TOKEN`
          
          The deployment tests both e926 and e621 from Vercel **before** it changes your Discord Interactions Endpoint URL.
          
          ## Deploy
          
          1. Put this project in your GitHub repository.
          2. Add the four Actions secrets above.
          3. Open **Actions → Deploy Shift Furry Bot → Run workflow**.
          4. The workflow deploys to Vercel, opens `/health`, and only then updates Discord.
          5. Test `/furry query:blue wolf` and `/furry-nsfw query:blue wolf`.
          
          ## Content controls
          
          The filtering is defense-in-depth, not a claim of perfect classification:
          
          - fixed ratings controlled by the application;
          - user attempts to use `rating:`, `order:`, and similar meta tags are rejected;
          - underage-related query terms are rejected;
          - negative underage tags are added to every API search;
          - returned posts are checked again before display;
          - unsupported video formats are skipped.
          
