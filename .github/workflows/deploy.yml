      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          npm run check
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('JSON files valid')"

      - name: Link Vercel project
        run: npx vercel link --yes --project shift-furry-search-fahir56 --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel and assign public production domain
        id: vercel
        shell: bash
        run: |
          set -euo pipefail

          # Vercel's unique generated deployment URL can be protected by Vercel
          # Authentication. Discord needs a public webhook, so use the stable
          # production domain instead.
          PROJECT_DOMAIN="shift-furry-search-fahir56.vercel.app"

          DEPLOY_URL="$(
            npx vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
              --env "DISCORD_PUBLIC_KEY=$DISCORD_PUBLIC_KEY"
          )"

          echo "Unique deployment URL: $DEPLOY_URL"
          echo "Assigning public production domain: https://$PROJECT_DOMAIN"
          npx vercel alias set "$DEPLOY_URL" "$PROJECT_DOMAIN" \
            --token="$VERCEL_TOKEN"

          echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "public_base_url=https://$PROJECT_DOMAIN" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}

      - name: Verify e926 and e621 from public Vercel domain
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="${{ steps.vercel.outputs.public_base_url }}/health?q=blue%20wolf"
          echo "Testing $HEALTH_URL"

          curl \
            --location \
            --max-redirs 5 \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --output /tmp/health.json \
            "$HEALTH_URL"

          cat /tmp/health.json
          node <<'NODE_EOF'
          const fs = require("fs");
          const raw = fs.readFileSync("/tmp/health.json", "utf8").trim();
          let report;
          try {
            report = JSON.parse(raw);
          } catch (error) {
            console.error("The public Vercel health endpoint did not return JSON.");
            console.error("Response preview:", raw.slice(0, 500));
            process.exit(1);
          }

          console.log(JSON.stringify(report, null, 2));
          if (!report.ok) {
            console.error("At least one artwork source is blocked from Vercel.");
            process.exit(1);
          }
          NODE_EOF

      - name: Point Discord to public Vercel domain and register commands
        run: node scripts/configure-discord.js
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          INTERACTIONS_ENDPOINT_URL: ${{ steps.vercel.outputs.public_base_url }}/api/interactions
