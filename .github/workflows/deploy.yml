name: Deploy Furry Art Discord App (Openverse)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: furry-art-user-app-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate application files
        shell: bash
        run: |
          mkdir -p src scripts

          cat > package.json <<'PACKAGE_EOF'
          {
            "name": "furry-art-discord-user-app",
            "version": "3.0.0",
            "private": true,
            "type": "module",
            "description": "A user-installed Discord app for searching non-mature, openly licensed furry artwork through Openverse.",
            "scripts": {
              "check": "node --check src/index.js && node --check scripts/register-commands.js",
              "deploy": "wrangler deploy",
              "register": "node scripts/register-commands.js"
            },
            "dependencies": {
              "discord-interactions": "4.4.0"
            },
            "devDependencies": {
              "wrangler": "4.114.0"
            },
            "engines": {
              "node": ">=22"
            }
          }
          PACKAGE_EOF

          cat > wrangler.jsonc <<'WRANGLER_EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "furry-art-finder-app",
            "main": "src/index.js",
            "compatibility_date": "2026-08-02",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "observability": {
              "enabled": true
            }
          }
          WRANGLER_EOF

          cat > src/index.js <<'WORKER_EOF'
          import { verifyKey } from "discord-interactions";

          const INTERACTION = Object.freeze({
            PING: 1,
            APPLICATION_COMMAND: 2,
            MESSAGE_COMPONENT: 3,
          });

          const RESPONSE = Object.freeze({
            PONG: 1,
            CHANNEL_MESSAGE_WITH_SOURCE: 4,
            UPDATE_MESSAGE: 7,
          });

          const EPHEMERAL = 1 << 6;
          const OPENVERSE_IMAGES_URL = "https://api.openverse.org/v1/images/";
          const USER_AGENT =
            "ShiftFurrySearch/3.0 (Discord user app; openly licensed artwork search)";

          const STOP_WORDS = new Set([
            "a", "an", "and", "art", "artwork", "drawing", "furry", "for",
            "from", "in", "of", "on", "picture", "please", "show", "the",
            "to", "with",
          ]);

          const BLOCKED_WORDS = new Set([
            "adult", "explicit", "fetish", "naked", "nude", "nsfw", "porn",
            "pornographic", "sex", "sexual", "yiff",
          ]);

          function json(data, status = 200) {
            return new Response(JSON.stringify(data), {
              status,
              headers: {
                "content-type": "application/json; charset=UTF-8",
                "cache-control": "no-store",
              },
            });
          }

          function ephemeralMessage(content) {
            return json({
              type: RESPONSE.CHANNEL_MESSAGE_WITH_SOURCE,
              data: { content, flags: EPHEMERAL },
            });
          }

          function cleanText(value, maxLength) {
            return String(value ?? "")
              .replace(/[\u0000-\u001F\u007F]/g, " ")
              .replace(/\s+/g, " ")
              .trim()
              .slice(0, maxLength);
          }

          function tokenizeQuery(input) {
            const raw = cleanText(input, 80).toLowerCase();
            if (!raw) return { terms: [], blocked: false };

            const pieces = raw.match(/"[^"]+"|'[^']+'|\S+/g) ?? [];
            const terms = [];
            let blocked = false;

            for (const piece of pieces) {
              const withoutQuotes = piece.replace(/^['"]|['"]$/g, "");
              const normalized = withoutQuotes
                .normalize("NFKD")
                .replace(/[^a-z0-9 _-]/g, "")
                .replace(/[-_\s]+/g, " ")
                .trim()
                .slice(0, 35);

              if (!normalized) continue;
              const words = normalized.split(/\s+/);
              if (words.some((word) => BLOCKED_WORDS.has(word))) {
                blocked = true;
                continue;
              }

              if (STOP_WORDS.has(normalized)) continue;
              terms.push(normalized);
            }

            return { terms: [...new Set(terms)].slice(0, 6), blocked };
          }

          function isHttpsUrl(value) {
            return typeof value === "string" && value.startsWith("https://");
          }

          function imageUrlFor(item) {
            const candidates = [item?.thumbnail, item?.url];
            return candidates.find(isHttpsUrl) ?? null;
          }

          function sourceUrlFor(item) {
            const candidates = [item?.foreign_landing_url, item?.detail_url, item?.url];
            return candidates.find(isHttpsUrl) ?? null;
          }

          function isDisplayableArtwork(item) {
            const filetype = String(item?.filetype ?? "").toLowerCase();
            const imageTypeOkay = !filetype || ["jpg", "jpeg", "png", "gif", "webp"].includes(filetype);
            return (
              item?.mature !== true &&
              imageTypeOkay &&
              Boolean(imageUrlFor(item)) &&
              Boolean(sourceUrlFor(item))
            );
          }

          function sleep(milliseconds) {
            return new Promise((resolve) => setTimeout(resolve, milliseconds));
          }

          async function requestOpenverse(query, page) {
            const url = new URL(OPENVERSE_IMAGES_URL);
            url.searchParams.set("q", query);
            url.searchParams.set("page_size", "50");
            url.searchParams.set("page", String(page));

            for (let attempt = 1; attempt <= 2; attempt += 1) {
              const response = await fetch(url, {
                headers: {
                  accept: "application/json",
                  "accept-encoding": "gzip, br",
                  "user-agent": USER_AGENT,
                },
              });

              const body = await response.text();
              if (response.ok) {
                try {
                  return JSON.parse(body);
                } catch {
                  console.error(
                    "Openverse returned non-JSON",
                    response.headers.get("content-type"),
                    body.slice(0, 300),
                  );
                  throw new Error("Openverse returned invalid JSON");
                }
              }

              console.error(
                "Openverse search attempt failed",
                `attempt=${attempt}`,
                `status=${response.status}`,
                response.headers.get("content-type"),
                body.slice(0, 300),
              );

              const retryable = [429, 500, 502, 503, 504].includes(response.status);
              if (!retryable || attempt === 2) {
                const error = new Error(`Openverse returned HTTP ${response.status}`);
                error.status = response.status;
                throw error;
              }

              await sleep(200 * attempt);
            }

            throw new Error("Openverse search failed without a response");
          }

          async function findArtwork(terms) {
            const text = terms.join(" ");
            const queries = [
              `furry ${text}`.trim(),
              `anthropomorphic animal ${text}`.trim(),
            ];

            let lastError = null;
            for (const query of queries) {
              try {
                const requestedPage = 1 + Math.floor(Math.random() * 3);
                let payload = await requestOpenverse(query, requestedPage);
                let results = Array.isArray(payload?.results) ? payload.results : [];
                let usable = results.filter(isDisplayableArtwork);

                // A less common query may not have enough pages. Retry page 1 before
                // moving to the alternate wording.
                if (usable.length === 0 && requestedPage !== 1) {
                  payload = await requestOpenverse(query, 1);
                  results = Array.isArray(payload?.results) ? payload.results : [];
                  usable = results.filter(isDisplayableArtwork);
                }

                if (usable.length > 0) {
                  return usable[Math.floor(Math.random() * usable.length)];
                }

                console.warn("Openverse query returned no usable images", query);
              } catch (error) {
                lastError = error;
                console.error("Openverse query failed; trying alternate wording", query, error);
              }
            }

            if (lastError) throw lastError;
            return null;
          }

          function buildArtworkMessage(item, terms) {
            const title = cleanText(item?.title ?? "Furry artwork", 200) || "Furry artwork";
            const creator = cleanText(item?.creator ?? "Unknown creator", 100) || "Unknown creator";
            const sourceUrl = sourceUrlFor(item);
            const imageUrl = imageUrlFor(item);
            const licenseName = cleanText(
              [item?.license, item?.license_version].filter(Boolean).join(" ").toUpperCase(),
              80,
            ) || "Open license";
            const licenseUrl = isHttpsUrl(item?.license_url) ? item.license_url : null;
            const searchText = terms.join(" ");
            const encodedTerms = encodeURIComponent(searchText).slice(0, 78);

            const licenseValue = licenseUrl
              ? `[${licenseName}](${licenseUrl})`
              : licenseName;

            return {
              embeds: [
                {
                  title,
                  url: sourceUrl,
                  description: `Search: \`${cleanText(searchText, 80)}\``,
                  fields: [
                    {
                      name: "Creator",
                      value: creator,
                      inline: true,
                    },
                    {
                      name: "License",
                      value: licenseValue,
                      inline: true,
                    },
                    {
                      name: "Credit & source",
                      value: `[Open the original source](${sourceUrl})`,
                      inline: false,
                    },
                  ],
                  image: { url: imageUrl },
                  footer: {
                    text: "Non-mature, openly licensed result from Openverse",
                  },
                },
              ],
              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      style: 1,
                      custom_id: `another:${encodedTerms}`,
                      label: "Another result",
                      emoji: { name: "🔄" },
                    },
                    {
                      type: 2,
                      style: 5,
                      url: sourceUrl,
                      label: "Open source",
                    },
                  ],
                },
              ],
              allowed_mentions: { parse: [] },
            };
          }

          async function searchAndBuild(terms) {
            const item = await findArtwork(terms);
            if (!item) return null;
            return buildArtworkMessage(item, terms);
          }

          async function handleCommand(interaction) {
            if (interaction?.data?.name !== "furry") {
              return ephemeralMessage("Unknown command.");
            }

            const queryOption = interaction?.data?.options?.find((option) => option.name === "query");
            const query = String(queryOption?.value ?? "");
            const { terms, blocked } = tokenizeQuery(query);

            if (blocked) {
              return ephemeralMessage(
                "This app only searches for non-explicit artwork. Try `blue wolf forest` instead.",
              );
            }

            if (terms.length === 0) {
              return ephemeralMessage(
                "Give me useful search words, such as `cute fox`, `dragon armor`, or `blue wolf forest`.",
              );
            }

            try {
              const message = await searchAndBuild(terms);
              if (!message) {
                return ephemeralMessage(
                  `No openly licensed image was found for \`${cleanText(terms.join(" "), 80)}\`. Try fewer or simpler words.`,
                );
              }

              return json({
                type: RESPONSE.CHANNEL_MESSAGE_WITH_SOURCE,
                data: message,
              });
            } catch (error) {
              console.error("Artwork search failed", error);
              const status = Number(error?.status ?? 0);
              if (status === 429) {
                return ephemeralMessage("The image search service is temporarily rate-limiting requests. Try again shortly.");
              }
              return ephemeralMessage("The image search service did not respond correctly. Please try again shortly.");
            }
          }

          async function handleComponent(interaction) {
            const customId = String(interaction?.data?.custom_id ?? "");
            if (!customId.startsWith("another:")) {
              return ephemeralMessage("Unknown button.");
            }

            let decoded = "";
            try {
              decoded = decodeURIComponent(customId.slice("another:".length));
            } catch {
              decoded = "";
            }

            const terms = decoded.split(/\s+/).filter(Boolean).slice(0, 6);
            if (terms.length === 0) {
              return ephemeralMessage("The saved search was invalid. Run `/furry` again.");
            }

            try {
              const message = await searchAndBuild(terms);
              if (!message) {
                return ephemeralMessage("No other openly licensed result was found for that search.");
              }

              return json({
                type: RESPONSE.UPDATE_MESSAGE,
                data: message,
              });
            } catch (error) {
              console.error("Artwork refresh failed", error);
              return ephemeralMessage("The image search service did not respond correctly. Please try again shortly.");
            }
          }

          export default {
            async fetch(request, env) {
              if (request.method === "GET") {
                return new Response(
                  "Furry Art Finder is online and using Openverse. Discord interactions use POST requests.",
                  { headers: { "content-type": "text/plain; charset=UTF-8" } },
                );
              }

              if (request.method !== "POST") {
                return new Response("Method Not Allowed", { status: 405 });
              }

              if (!env.DISCORD_PUBLIC_KEY) {
                console.error("DISCORD_PUBLIC_KEY is not configured");
                return new Response("Server is not configured", { status: 500 });
              }

              const signature = request.headers.get("x-signature-ed25519");
              const timestamp = request.headers.get("x-signature-timestamp");
              const rawBody = await request.text();

              if (!signature || !timestamp) {
                return new Response("Missing Discord signature", { status: 401 });
              }

              const valid = await verifyKey(rawBody, signature, timestamp, env.DISCORD_PUBLIC_KEY);
              if (!valid) {
                return new Response("Invalid request signature", { status: 401 });
              }

              let interaction;
              try {
                interaction = JSON.parse(rawBody);
              } catch {
                return new Response("Invalid JSON", { status: 400 });
              }

              if (interaction.type === INTERACTION.PING) {
                return json({ type: RESPONSE.PONG });
              }

              if (interaction.type === INTERACTION.APPLICATION_COMMAND) {
                return handleCommand(interaction);
              }

              if (interaction.type === INTERACTION.MESSAGE_COMPONENT) {
                return handleComponent(interaction);
              }

              return ephemeralMessage("Unsupported Discord interaction.");
            },
          };
          WORKER_EOF

          cat > scripts/register-commands.js <<'REGISTER_EOF'
          const applicationId = process.env.DISCORD_APPLICATION_ID;
          const botToken = process.env.DISCORD_BOT_TOKEN;
          const legacyGuildId = process.env.DISCORD_GUILD_ID?.trim();

          if (!applicationId || !botToken) {
            console.error(
              "Missing DISCORD_APPLICATION_ID or DISCORD_BOT_TOKEN. Add them as GitHub Actions secrets.",
            );
            process.exit(1);
          }

          const commands = [
            {
              name: "furry",
              type: 1,
              description: "Find non-mature, openly licensed furry artwork",
              nsfw: false,
              integration_types: [1],
              contexts: [0, 1, 2],
              options: [
                {
                  type: 3,
                  name: "query",
                  description: "Example: blue wolf forest, cute fox, or dragon armor",
                  required: true,
                  min_length: 2,
                  max_length: 80,
                },
              ],
            },
          ];

          async function putCommands(endpoint, commandList) {
            const response = await fetch(endpoint, {
              method: "PUT",
              headers: {
                Authorization: `Bot ${botToken}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(commandList),
            });

            const body = await response.text();
            if (!response.ok) {
              throw new Error(`Discord command registration failed (${response.status}): ${body}`);
            }
          }

          try {
            await putCommands(
              `https://discord.com/api/v10/applications/${applicationId}/commands`,
              commands,
            );
            console.log("Registered /furry globally for User Install.");

            if (legacyGuildId) {
              await putCommands(
                `https://discord.com/api/v10/applications/${applicationId}/guilds/${legacyGuildId}/commands`,
                [],
              );
              console.log(`Removed legacy guild commands from ${legacyGuildId}.`);
            }
          } catch (error) {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          }
          REGISTER_EOF

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: npm run check

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Add Discord public key to Worker
        shell: bash
        run: printf '%s' "$DISCORD_PUBLIC_KEY" | npx wrangler secret put DISCORD_PUBLIC_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}

      - name: Register user-installed slash command
        run: npm run register
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
