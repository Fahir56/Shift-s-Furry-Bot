name: Deploy Furry Art Discord App (DeviantArt OAuth 2.1)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: furry-art-user-app-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate application files
        shell: bash
        run: |
          mkdir -p src scripts

          cat > package.json <<'PACKAGE_EOF'
          {
            "name": "furry-art-discord-user-app",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "description": "A user-installed Discord app for searching non-mature furry artwork on DeviantArt from DMs, group DMs, and servers.",
            "scripts": {
              "check": "node --check src/index.js && node --check scripts/register-commands.js",
              "dev": "wrangler dev",
              "deploy": "wrangler deploy",
              "register": "node scripts/register-commands.js"
            },
            "dependencies": {
              "discord-interactions": "4.4.0"
            },
            "devDependencies": {
              "wrangler": "4.114.0"
            },
            "engines": {
              "node": ">=22"
            }
          }
          PACKAGE_EOF

          cat > wrangler.jsonc <<'WRANGLER_EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "furry-art-finder-app",
            "main": "src/index.js",
            "compatibility_date": "2026-08-02",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "observability": {
              "enabled": true,
              "logs": {
                "invocation_logs": true,
                "head_sampling_rate": 1
              }
            }
          }
          WRANGLER_EOF

          cat > src/index.js <<'WORKER_EOF'
          import { verifyKey } from "discord-interactions";
          
          const INTERACTION = Object.freeze({
            PING: 1,
            APPLICATION_COMMAND: 2,
            MESSAGE_COMPONENT: 3,
          });
          
          const RESPONSE = Object.freeze({
            PONG: 1,
            CHANNEL_MESSAGE_WITH_SOURCE: 4,
            UPDATE_MESSAGE: 7,
          });
          
          const EPHEMERAL = 1 << 6;
          const DEVIANTART_AUTHORIZE_URL = "https://www.deviantart.com/oauth2/authorize";
          const DEVIANTART_TOKEN_URL = "https://www.deviantart.com/oauth2/token";
          const DEVIANTART_PLACEBO_URL = "https://www.deviantart.com/api/v1/oauth2/placebo";
          const DEVIANTART_TAG_URL = "https://www.deviantart.com/api/v1/oauth2/browse/tags";
          const DEVIANTART_SEARCH_ENDPOINTS = [
            "https://www.deviantart.com/api/v1/oauth2/browse/newest",
            "https://www.deviantart.com/api/v1/oauth2/browse/popular",
          ];
          const USER_AGENT =
            "ShiftFurrySearch/3.0 (by Fahir56 on GitHub; non-mature art search)";
          const WORKER_ORIGIN = "https://furry-art-finder-app.hsa94110.workers.dev";
          const DEVIANTART_REDIRECT_URI = `${WORKER_ORIGIN}/oauth/callback`;
          const API_MINOR_VERSION = "20240701";
          
          let cachedDeviantArtToken = null;
          let cachedDeviantArtTokenExpiresAt = 0;
          let cachedDeviantArtTokenSource = null;
          let cachedDeviantArtTokenMetadata = null;
          
          const STOP_WORDS = new Set([
            "a",
            "an",
            "and",
            "art",
            "artwork",
            "drawing",
            "furry",
            "for",
            "from",
            "in",
            "of",
            "on",
            "picture",
            "please",
            "show",
            "the",
            "to",
            "with",
          ]);
          
          const BLOCKED_WORDS = new Set([
            "adult",
            "explicit",
            "fetish",
            "naked",
            "nude",
            "nsfw",
            "porn",
            "pornographic",
            "sex",
            "sexual",
            "yiff",
          ]);
          
          const FUR_COLORS = new Set([
            "black",
            "blue",
            "brown",
            "cyan",
            "gray",
            "green",
            "grey",
            "orange",
            "pink",
            "purple",
            "red",
            "tan",
            "teal",
            "white",
            "yellow",
          ]);
          
          function json(data, status = 200) {
            return new Response(JSON.stringify(data), {
              status,
              headers: {
                "content-type": "application/json; charset=UTF-8",
                "cache-control": "no-store",
              },
            });
          }
          
          function ephemeralMessage(content) {
            return json({
              type: RESPONSE.CHANNEL_MESSAGE_WITH_SOURCE,
              data: { content, flags: EPHEMERAL },
            });
          }
          
          function cleanText(value, maxLength) {
            return String(value ?? "")
              .replace(/[\u0000-\u001F\u007F]/g, " ")
              .replace(/\s+/g, " ")
              .trim()
              .slice(0, maxLength);
          }
          
          function tokenizeQuery(input) {
            const raw = cleanText(input, 60).toLowerCase();
            if (!raw) return { tags: [], blocked: false };
          
            const pieces = raw.match(/"[^"]+"|'[^']+'|\S+/g) ?? [];
            const tokens = [];
            let blocked = false;
          
            for (const piece of pieces) {
              const withoutQuotes = piece.replace(/^['"]|['"]$/g, "");
              const normalized = withoutQuotes
                .normalize("NFKD")
                .replace(/[^a-z0-9 _-]/g, "")
                .replace(/[-\s]+/g, "_")
                .replace(/^_+|_+$/g, "")
                .slice(0, 30);
          
              if (!normalized) continue;
          
              const words = normalized.split("_");
              if (words.some((word) => BLOCKED_WORDS.has(word))) {
                blocked = true;
                continue;
              }
          
              if (STOP_WORDS.has(normalized)) continue;
              tokens.push(normalized);
            }
          
            const unique = [...new Set(tokens)];
          
            // DeviantArt accepts a normal text query. Keep enough words to preserve
            // the user's description while preventing very long search strings.
            return { tags: unique.slice(0, 5), blocked };
          }
          
          function normalizeSearchTerms(tags) {
            return tags
              .map((tag) => tag.replaceAll("_", " "))
              .filter(Boolean)
              .join(" ");
          }
          
          function imageUrlFor(deviation) {
            const candidates = [
              deviation?.content?.src,
              deviation?.thumbs?.find((thumb) => Number(thumb?.height ?? 0) >= 400)?.src,
              deviation?.thumbs?.at?.(-1)?.src,
            ];
            return candidates.find(
              (value) => typeof value === "string" && value.startsWith("https://"),
            );
          }
          
          function isDisplayableArtwork(deviation) {
            return (
              deviation?.is_mature === false &&
              deviation?.is_deleted !== true &&
              Boolean(imageUrlFor(deviation)) &&
              typeof deviation?.url === "string" &&
              deviation.url.startsWith("https://")
            );
          }
          
          function sleep(milliseconds) {
            return new Promise((resolve) => setTimeout(resolve, milliseconds));
          }
          
          function bytesToBase64Url(bytes) {
            let binary = "";
            for (let offset = 0; offset < bytes.length; offset += 0x8000) {
              binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
            }
            return btoa(binary).replaceAll("+", "-").replaceAll("/", "_").replace(/=+$/g, "");
          }
          
          function textToBase64Url(text) {
            return bytesToBase64Url(new TextEncoder().encode(text));
          }
          
          function base64UrlToText(value) {
            const normalized = value.replaceAll("-", "+").replaceAll("_", "/");
            const padded = normalized + "=".repeat((4 - (normalized.length % 4)) % 4);
            const binary = atob(padded);
            const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
            return new TextDecoder().decode(bytes);
          }
          
          function randomBase64Url(byteLength = 32) {
            const bytes = new Uint8Array(byteLength);
            crypto.getRandomValues(bytes);
            return bytesToBase64Url(bytes);
          }
          
          async function sha256Base64Url(value) {
            const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value));
            return bytesToBase64Url(new Uint8Array(digest));
          }
          
          async function hmacBase64Url(secret, value) {
            const key = await crypto.subtle.importKey(
              "raw",
              new TextEncoder().encode(secret),
              { name: "HMAC", hash: "SHA-256" },
              false,
              ["sign"],
            );
            const signature = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(value));
            return bytesToBase64Url(new Uint8Array(signature));
          }
          
          function constantTimeTextEqual(left, right) {
            if (left.length !== right.length) return false;
            let difference = 0;
            for (let index = 0; index < left.length; index += 1) {
              difference |= left.charCodeAt(index) ^ right.charCodeAt(index);
            }
            return difference === 0;
          }
          
          function parseCookies(request) {
            const result = {};
            for (const pair of String(request.headers.get("cookie") ?? "").split(";")) {
              const separator = pair.indexOf("=");
              if (separator < 1) continue;
              const key = pair.slice(0, separator).trim();
              const value = pair.slice(separator + 1).trim();
              if (key) result[key] = value;
            }
            return result;
          }
          
          async function createSignedOauthCookie(payload, secret) {
            const encoded = textToBase64Url(JSON.stringify(payload));
            const signature = await hmacBase64Url(secret, encoded);
            return `${encoded}.${signature}`;
          }
          
          async function readSignedOauthCookie(value, secret) {
            const [encoded, signature, extra] = String(value ?? "").split(".");
            if (!encoded || !signature || extra) return null;
            const expected = await hmacBase64Url(secret, encoded);
            if (!constantTimeTextEqual(signature, expected)) return null;
            try {
              const payload = JSON.parse(base64UrlToText(encoded));
              if (Number(payload?.expires_at ?? 0) < Date.now()) return null;
              return payload;
            } catch {
              return null;
            }
          }
          
          function htmlEscape(value) {
            return String(value ?? "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&#39;");
          }
          
          function htmlPage(title, body, status = 200, extraHeaders = {}) {
            return new Response(
              `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${htmlEscape(title)}</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:36px auto;padding:0 18px;line-height:1.5;background:#111;color:#eee}code,pre{background:#222;border-radius:8px;padding:10px;display:block;overflow-wrap:anywhere;white-space:pre-wrap}a{color:#8ab4ff}.ok{color:#79d279}.bad{color:#ff8c8c}</style></head><body><h1>${htmlEscape(title)}</h1>${body}</body></html>`,
              {
                status,
                headers: {
                  "content-type": "text/html; charset=UTF-8",
                  "cache-control": "no-store, private",
                  ...extraHeaders,
                },
              },
            );
          }
          
          function deviantArtBaseHeaders() {
            return {
              accept: "application/json",
              "accept-encoding": "gzip, br",
              "user-agent": USER_AGENT,
            };
          }
          
          function isAllowedDeviantArtRedirect(url) {
            const hostname = new URL(url).hostname.toLowerCase();
            return hostname === "deviantart.com" || hostname === "www.deviantart.com" || hostname.endsWith(".deviantart.com");
          }
          
          async function fetchDeviantArtWithBearer(url, token, options = {}) {
            let currentUrl = new URL(url.toString());
            for (let redirectCount = 0; redirectCount <= 3; redirectCount += 1) {
              const headers = new Headers(options.headers ?? {});
              for (const [name, value] of Object.entries(deviantArtBaseHeaders())) {
                if (!headers.has(name)) headers.set(name, value);
              }
              headers.set("Authorization", `Bearer ${token}`);
              headers.set("dA-minor-version", API_MINOR_VERSION);
          
              const response = await fetch(currentUrl, {
                ...options,
                headers,
                redirect: "manual",
              });
          
              if (![301, 302, 303, 307, 308].includes(response.status)) return response;
              const location = response.headers.get("location");
              if (!location) return response;
              const nextUrl = new URL(location, currentUrl);
              console.warn("DeviantArt redirect", currentUrl.toString(), "->", nextUrl.toString());
              if (nextUrl.protocol !== "https:" || !isAllowedDeviantArtRedirect(nextUrl)) {
                throw new Error("DeviantArt redirected to an unexpected host");
              }
              currentUrl = nextUrl;
            }
            throw new Error("Too many DeviantArt redirects");
          }
          
          async function requestOAuthToken(env, grantFields, credentialMode = "body") {
            if (!env.DEVIANTART_CLIENT_ID || !env.DEVIANTART_CLIENT_SECRET) {
              throw new Error("DEVIANTART_CLIENT_ID or DEVIANTART_CLIENT_SECRET is not configured");
            }
          
            const form = new URLSearchParams(grantFields);
            const headers = {
              ...deviantArtBaseHeaders(),
              "content-type": "application/x-www-form-urlencoded",
            };
          
            if (credentialMode === "basic") {
              headers.Authorization = `Basic ${btoa(`${env.DEVIANTART_CLIENT_ID}:${env.DEVIANTART_CLIENT_SECRET}`)}`;
            } else {
              form.set("client_id", env.DEVIANTART_CLIENT_ID);
              form.set("client_secret", env.DEVIANTART_CLIENT_SECRET);
            }
          
            const response = await fetch(DEVIANTART_TOKEN_URL, {
              method: "POST",
              headers,
              body: form.toString(),
              redirect: "manual",
            });
            const body = await response.text();
          
            let payload = null;
            try {
              payload = JSON.parse(body);
            } catch {}
          
            if (!response.ok || typeof payload?.access_token !== "string") {
              const error = new Error(
                `DeviantArt token request failed (${response.status}): ${cleanText(payload?.error ?? body, 160)}`,
              );
              error.status = response.status;
              error.oauthError = payload?.error;
              throw error;
            }
          
            const accessToken = payload.access_token.trim();
            if (!accessToken) throw new Error("DeviantArt returned an empty access token");
            return {
              accessToken,
              refreshToken: typeof payload?.refresh_token === "string" ? payload.refresh_token.trim() : null,
              expiresIn: Math.max(60, Number(payload?.expires_in ?? 3600)),
              tokenType: String(payload?.token_type ?? "Bearer"),
              scope: String(payload?.scope ?? ""),
              status: String(payload?.status ?? ""),
              credentialMode,
            };
          }
          
          async function requestOAuthTokenWithFallback(env, grantFields) {
            let lastError = null;
            for (const credentialMode of ["basic", "body"]) {
              try {
                return await requestOAuthToken(env, grantFields, credentialMode);
              } catch (error) {
                lastError = error;
                console.error("DeviantArt token mode failed", credentialMode, error);
              }
            }
            throw lastError ?? new Error("DeviantArt token request failed");
          }
          
          async function probeDeviantArtToken(token) {
            const tests = [];
            for (const [name, url, method] of [
              ["placebo:header", DEVIANTART_PLACEBO_URL, "GET"],
              ["tag:furry:header", `${DEVIANTART_TAG_URL}?tag=furry&limit=1&offset=0&mature_content=false&with_session=false`, "GET"],
            ]) {
              try {
                const response = await fetchDeviantArtWithBearer(new URL(url), token, { method });
                const body = await response.text();
                tests.push({ name, ok: response.ok, status: response.status, body: body.slice(0, 180) });
                if (response.ok) return { ok: true, tests };
              } catch (error) {
                tests.push({ name, ok: false, error: String(error?.message ?? error) });
              }
            }
            return { ok: false, tests };
          }
          
          function cacheDeviantArtToken(tokenResult, source) {
            cachedDeviantArtToken = tokenResult.accessToken;
            cachedDeviantArtTokenExpiresAt =
              Date.now() + Math.max(60, tokenResult.expiresIn - 120) * 1000;
            cachedDeviantArtTokenSource = source;
            cachedDeviantArtTokenMetadata = {
              source,
              token_type: tokenResult.tokenType,
              expires_in: tokenResult.expiresIn,
              scope: tokenResult.scope,
              credential_mode: tokenResult.credentialMode,
              token_length: tokenResult.accessToken.length,
            };
            return cachedDeviantArtToken;
          }
          
          function setupRequiredError(details = null) {
            const error = new Error("DeviantArt needs one-time user authorization");
            error.code = "DA_SETUP_REQUIRED";
            error.details = details;
            return error;
          }
          
          async function getDeviantArtToken(env, forceRefresh = false) {
            const now = Date.now();
            if (!forceRefresh && cachedDeviantArtToken && now < cachedDeviantArtTokenExpiresAt) {
              return cachedDeviantArtToken;
            }
          
            cachedDeviantArtToken = null;
            cachedDeviantArtTokenExpiresAt = 0;
          
            if (env.DEVIANTART_REFRESH_TOKEN) {
              try {
                const refreshed = await requestOAuthTokenWithFallback(env, {
                  grant_type: "refresh_token",
                  refresh_token: env.DEVIANTART_REFRESH_TOKEN,
                });
                if (refreshed.refreshToken && refreshed.refreshToken !== env.DEVIANTART_REFRESH_TOKEN) {
                  console.warn("DeviantArt returned a rotated refresh token; update the GitHub secret from the setup page if refresh later fails.");
                }
                return cacheDeviantArtToken(refreshed, "refresh_token");
              } catch (error) {
                console.error("Stored DeviantArt refresh token failed", error);
                throw setupRequiredError({ refresh_token_failed: true });
              }
            }
          
            const attempts = [
              { grant_type: "client_credentials", scope: "browse" },
              { grant_type: "client_credentials" },
            ];
            const diagnostics = [];
          
            for (const grantFields of attempts) {
              try {
                const clientToken = await requestOAuthTokenWithFallback(env, grantFields);
                const probe = await probeDeviantArtToken(clientToken.accessToken);
                diagnostics.push({ grantFields, token: { expires_in: clientToken.expiresIn, scope: clientToken.scope }, probe });
                if (probe.ok) return cacheDeviantArtToken(clientToken, "client_credentials");
              } catch (error) {
                diagnostics.push({ grantFields, error: String(error?.message ?? error) });
              }
            }
          
            console.error("DeviantArt client-credentials tokens were unusable", diagnostics);
            throw setupRequiredError(diagnostics);
          }
          
          async function handleDeviantArtSetup(request, env) {
            if (!env.DEVIANTART_CLIENT_ID || !env.DEVIANTART_CLIENT_SECRET) {
              return htmlPage("DeviantArt setup", '<p class="bad">Client ID or Client Secret is missing from the Worker.</p>', 500);
            }
          
            const verifier = randomBase64Url(64);
            const challenge = await sha256Base64Url(verifier);
            const state = randomBase64Url(24);
            const cookieValue = await createSignedOauthCookie(
              {
                verifier,
                state,
                redirect_uri: DEVIANTART_REDIRECT_URI,
                expires_at: Date.now() + 10 * 60 * 1000,
              },
              env.DEVIANTART_CLIENT_SECRET,
            );
          
            const authorizeUrl = new URL(DEVIANTART_AUTHORIZE_URL);
            authorizeUrl.searchParams.set("response_type", "code");
            authorizeUrl.searchParams.set("client_id", env.DEVIANTART_CLIENT_ID);
            authorizeUrl.searchParams.set("redirect_uri", DEVIANTART_REDIRECT_URI);
            authorizeUrl.searchParams.set("scope", "basic browse");
            authorizeUrl.searchParams.set("state", state);
            authorizeUrl.searchParams.set("code_challenge", challenge);
            authorizeUrl.searchParams.set("code_challenge_method", "S256");
          
            return new Response(null, {
              status: 302,
              headers: {
                location: authorizeUrl.toString(),
                "set-cookie": `da_oauth=${cookieValue}; Max-Age=600; Path=/; HttpOnly; Secure; SameSite=Lax`,
                "cache-control": "no-store",
              },
            });
          }
          
          async function handleDeviantArtCallback(request, env) {
            const url = new URL(request.url);
            const oauthError = url.searchParams.get("error");
            if (oauthError) {
              return htmlPage(
                "DeviantArt authorization failed",
                `<p class="bad">${htmlEscape(oauthError)}: ${htmlEscape(url.searchParams.get("error_description") ?? "No description")}</p>`,
                400,
              );
            }
          
            const code = url.searchParams.get("code");
            const state = url.searchParams.get("state");
            const cookie = parseCookies(request).da_oauth;
            const saved = await readSignedOauthCookie(cookie, env.DEVIANTART_CLIENT_SECRET);
            if (!code || !state || !saved || !constantTimeTextEqual(state, String(saved.state ?? ""))) {
              return htmlPage(
                "DeviantArt authorization failed",
                '<p class="bad">The setup session is missing, expired, or invalid. Open <a href="/setup/deviantart">the setup page</a> and try again.</p>',
                400,
              );
            }
          
            try {
              const tokenResult = await requestOAuthTokenWithFallback(env, {
                grant_type: "authorization_code",
                code,
                redirect_uri: saved.redirect_uri,
                code_verifier: saved.verifier,
              });
              const probe = await probeDeviantArtToken(tokenResult.accessToken);
              const clearCookie = "da_oauth=; Max-Age=0; Path=/; HttpOnly; Secure; SameSite=Lax";
          
              if (!tokenResult.refreshToken) {
                return htmlPage(
                  "DeviantArt authorized, but no refresh token was returned",
                  `<p class="bad">Authorization completed, but DeviantArt did not issue a refresh token. Probe result:</p><pre>${htmlEscape(JSON.stringify(probe, null, 2))}</pre>`,
                  500,
                  { "set-cookie": clearCookie },
                );
              }
          
              return htmlPage(
                "DeviantArt authorization complete",
                `<p class="ok">The user access token works: ${probe.ok ? "yes" : "not confirmed"}.</p><p>Create one additional GitHub Actions secret:</p><pre>Name: DEVIANTART_REFRESH_TOKEN
          Value: ${htmlEscape(tokenResult.refreshToken)}</pre><p>Then rerun the GitHub workflow. Treat this refresh token like a password and do not post it in chat.</p><p>After deployment, check <a href="/debug/deviantart">/debug/deviantart</a>.</p>`,
                200,
                { "set-cookie": clearCookie },
              );
            } catch (error) {
              console.error("DeviantArt authorization-code exchange failed", error);
              return htmlPage(
                "DeviantArt authorization failed",
                `<p class="bad">${htmlEscape(error?.message ?? error)}</p><p>Open <a href="/setup/deviantart">the setup page</a> and try again.</p>`,
                500,
                { "set-cookie": "da_oauth=; Max-Age=0; Path=/; HttpOnly; Secure; SameSite=Lax" },
              );
            }
          }
          
          async function requestDeviantArtJson(url, token, label, maxAttempts = 3) {
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              console.log("DeviantArt request", label, `attempt=${attempt}`, url.toString());
              const response = await fetchDeviantArtWithBearer(url, token, { method: "GET" });
              const body = await response.text();
          
              console.log(
                "DeviantArt response",
                label,
                `attempt=${attempt}`,
                `status=${response.status}`,
                response.headers.get("content-type") ?? "unknown",
              );
          
              if (response.ok) {
                try {
                  return JSON.parse(body);
                } catch {
                  console.error("DeviantArt returned non-JSON", label, body.slice(0, 300));
                  throw new Error("Artwork source returned invalid JSON");
                }
              }
          
              console.error(
                "DeviantArt request failed",
                label,
                `attempt=${attempt}`,
                `status=${response.status}`,
                body.slice(0, 300),
              );
          
              if (response.status === 401 && cachedDeviantArtTokenSource === "refresh_token") {
                cachedDeviantArtToken = null;
                cachedDeviantArtTokenExpiresAt = 0;
              }
          
              const retryable = [429, 500, 502, 503, 504].includes(response.status);
              if (!retryable || attempt === maxAttempts) {
                const error = new Error(`Artwork source returned HTTP ${response.status}`);
                error.status = response.status;
                error.label = label;
                throw error;
              }
          
              await sleep(350 * 2 ** (attempt - 1));
            }
          
            throw new Error("DeviantArt request failed without a response");
          }
          
          async function requestDeviantArtTag(tag, token) {
            const url = new URL(DEVIANTART_TAG_URL);
            url.searchParams.set("tag", tag);
            url.searchParams.set("limit", "50");
            url.searchParams.set("offset", "0");
            url.searchParams.set("mature_content", "false");
            url.searchParams.set("with_session", "false");
            return requestDeviantArtJson(url, token, `tag:${tag}`, 2);
          }
          
          async function requestDeviantArtSearch(endpoint, token, query) {
            const url = new URL(endpoint);
            url.searchParams.set("q", query);
            url.searchParams.set("limit", "40");
            url.searchParams.set("offset", "0");
            url.searchParams.set("mature_content", "false");
            url.searchParams.set("with_session", "false");
          
            if (endpoint.endsWith("/popular")) {
              url.searchParams.set("timerange", "alltime");
            }
          
            return requestDeviantArtJson(url, token, endpoint.split("/").at(-1), 3);
          }
          
          function rankArtwork(deviation, tags) {
            const haystack = cleanText(
              `${deviation?.title ?? ""} ${deviation?.author?.username ?? ""}`,
              500,
            ).toLowerCase();
            let score = 0;
            for (const tag of tags) {
              const term = tag.replaceAll("_", " ").toLowerCase();
              if (term && haystack.includes(term)) score += 3;
            }
            score += Math.min(5, Number(deviation?.stats?.favourites ?? 0) / 1000);
            return score + Math.random();
          }
          
          async function findArtwork(tags, env) {
            const token = await getDeviantArtToken(env);
            const terms = normalizeSearchTerms(tags);
            const query = `furry ${terms}`.trim();
            const collected = new Map();
            let lastError = null;
          
            // Tag browsing is a separate DeviantArt endpoint and is often more stable
            // than text search. Try useful query tags first, then furry/anthro.
            const tagCandidates = [
              ...tags.filter((tag) => !FUR_COLORS.has(tag)),
              ...tags.filter((tag) => FUR_COLORS.has(tag)),
              "furry",
              "anthro",
            ]
              .map((tag) => tag.replace(/[^a-z0-9_]/gi, "").slice(0, 30))
              .filter(Boolean);
          
            for (const tag of [...new Set(tagCandidates)].slice(0, 4)) {
              try {
                const payload = await requestDeviantArtTag(tag, token);
                const results = Array.isArray(payload?.results) ? payload.results : [];
                for (const deviation of results.filter(isDisplayableArtwork)) {
                  const id = String(deviation?.deviationid ?? deviation?.url ?? "");
                  if (id) collected.set(id, deviation);
                }
                if (collected.size >= 20) break;
              } catch (error) {
                lastError = error;
                console.error("DeviantArt tag endpoint failed; continuing", tag, error);
              }
            }
          
            if (collected.size > 0) {
              return [...collected.values()]
                .sort((a, b) => rankArtwork(b, tags) - rankArtwork(a, tags))[0];
            }
          
            // Fall back to normal DeviantArt text-search endpoints.
            for (const endpoint of DEVIANTART_SEARCH_ENDPOINTS) {
              try {
                const payload = await requestDeviantArtSearch(endpoint, token, query);
                const results = Array.isArray(payload?.results) ? payload.results : [];
                const usable = results.filter(isDisplayableArtwork);
                if (usable.length > 0) {
                  return usable.sort((a, b) => rankArtwork(b, tags) - rankArtwork(a, tags))[0];
                }
                console.warn("DeviantArt endpoint returned no usable images", endpoint, query);
              } catch (error) {
                lastError = error;
                console.error("DeviantArt endpoint failed; trying fallback", endpoint, error);
              }
            }
          
            if (lastError) throw lastError;
            return null;
          }
          
          async function runDeviantArtDiagnostics(env) {
            const report = {
              ok: false,
              generated_at: new Date().toISOString(),
              oauth_mode: "OAuth 2.1 bearer header",
              credentials_present: {
                client_id: Boolean(env.DEVIANTART_CLIENT_ID),
                client_secret: Boolean(env.DEVIANTART_CLIENT_SECRET),
                refresh_token: Boolean(env.DEVIANTART_REFRESH_TOKEN),
              },
              setup_url: `${WORKER_ORIGIN}/setup/deviantart`,
              token: null,
              tests: [],
            };
          
            let token;
            try {
              token = await getDeviantArtToken(env, true);
              report.token = cachedDeviantArtTokenMetadata;
            } catch (error) {
              report.error = String(error?.message ?? error);
              report.error_code = error?.code ?? null;
              report.details = error?.details ?? null;
              return report;
            }
          
            const tests = [
              ["placebo:header", new URL(DEVIANTART_PLACEBO_URL)],
              [
                "tag:furry:header",
                new URL(`${DEVIANTART_TAG_URL}?tag=furry&limit=5&offset=0&mature_content=false&with_session=false`),
              ],
              [
                "newest:furry:header",
                new URL(`${DEVIANTART_SEARCH_ENDPOINTS[0]}?q=furry&limit=5&offset=0&mature_content=false&with_session=false`),
              ],
            ];
          
            for (const [name, url] of tests) {
              try {
                const response = await fetchDeviantArtWithBearer(url, token, { method: "GET" });
                const body = await response.text();
                let resultCount = null;
                try {
                  const parsed = JSON.parse(body);
                  resultCount = Array.isArray(parsed?.results) ? parsed.results.length : null;
                } catch {}
                report.tests.push({
                  name,
                  ok: response.ok,
                  status: response.status,
                  content_type: response.headers.get("content-type"),
                  result_count: resultCount,
                  body_preview: response.ok ? undefined : body.slice(0, 180),
                });
              } catch (error) {
                report.tests.push({ name, ok: false, error: String(error?.message ?? error) });
              }
            }
          
            report.ok = report.tests.some(
              (test) => ["tag:furry:header", "newest:furry:header"].includes(test.name) && test.ok,
            );
            return report;
          }
          
          function buildArtworkMessage(deviation, tags) {
            const artistText = cleanText(deviation?.author?.username ?? "Unknown", 100);
            const postUrl = deviation.url;
            const imageUrl = imageUrlFor(deviation);
            const title = cleanText(deviation?.title ?? "Furry artwork", 200);
            const matchedTerms = normalizeSearchTerms(tags);
            const encodedTags = encodeURIComponent(tags.join(" ")).slice(0, 78);
          
            return {
              embeds: [
                {
                  title: title || "Non-mature furry artwork",
                  url: postUrl,
                  description: `Search: \`${cleanText(matchedTerms, 80)}\``,
                  fields: [
                    {
                      name: "Artist",
                      value: artistText || "Unknown",
                      inline: true,
                    },
                    {
                      name: "Credit & source",
                      value: `[Open on DeviantArt](${postUrl})`,
                      inline: false,
                    },
                  ],
                  image: { url: imageUrl },
                  footer: {
                    text: "Non-mature result from DeviantArt",
                  },
                },
              ],
              components: [
                {
                  type: 1,
                  components: [
                    {
                      type: 2,
                      style: 1,
                      custom_id: `another:${encodedTags}`,
                      label: "Another result",
                      emoji: { name: "🔄" },
                    },
                    {
                      type: 2,
                      style: 5,
                      url: postUrl,
                      label: "Open post",
                    },
                  ],
                },
              ],
              allowed_mentions: { parse: [] },
            };
          }
          
          async function searchAndBuild(tags, env) {
            const deviation = await findArtwork(tags, env);
            if (!deviation) return null;
            return buildArtworkMessage(deviation, tags);
          }
          
          async function handleCommand(interaction, env) {
            if (interaction?.data?.name !== "furry") {
              return ephemeralMessage("Unknown command.");
            }
          
            const queryOption = interaction?.data?.options?.find((option) => option.name === "query");
            const query = String(queryOption?.value ?? "");
            const { tags, blocked } = tokenizeQuery(query);
          
            if (blocked) {
              return ephemeralMessage(
                "This bot only searches for safe artwork. Try a non-explicit description such as `blue wolf forest`.",
              );
            }
          
            if (tags.length === 0) {
              return ephemeralMessage(
                "Give me one or two useful words, such as `cute fox`, `dragon armor`, or `blue wolf forest`.",
              );
            }
          
            try {
              const message = await searchAndBuild(tags, env);
              if (!message) {
                return ephemeralMessage(
                  `No safe image result was found for \`${cleanText(tags.join(" "), 80)}\`. Try fewer or simpler words.`,
                );
              }
          
              return json({
                type: RESPONSE.CHANNEL_MESSAGE_WITH_SOURCE,
                data: message,
              });
            } catch (error) {
              console.error("Artwork search failed", error);
              const status = Number(error?.status ?? 0);
              if (status >= 500) {
                return ephemeralMessage(
                  "DeviantArt is returning a temporary server error. The bot tried both search endpoints; please try again in a minute.",
                );
              }
              return ephemeralMessage("The artwork source did not respond correctly. Please try again shortly.");
            }
          }
          
          async function handleComponent(interaction, env) {
            const customId = String(interaction?.data?.custom_id ?? "");
            if (!customId.startsWith("another:")) {
              return ephemeralMessage("Unknown button.");
            }
          
            let decoded;
            try {
              decoded = decodeURIComponent(customId.slice("another:".length));
            } catch {
              decoded = "";
            }
          
            const tags = decoded.split(/\s+/).filter(Boolean).slice(0, 2);
            if (tags.length === 0) {
              return ephemeralMessage("The saved search was invalid. Run `/furry` again.");
            }
          
            try {
              const message = await searchAndBuild(tags, env);
              if (!message) {
                return ephemeralMessage("No other safe result was found for that search.");
              }
          
              return json({
                type: RESPONSE.UPDATE_MESSAGE,
                data: message,
              });
            } catch (error) {
              console.error("Artwork refresh failed", error);
              return ephemeralMessage("The artwork source did not respond correctly. Please try again shortly.");
            }
          }
          
          export default {
            async fetch(request, env) {
              const requestUrl = new URL(request.url);
              console.log("Worker invocation", request.method, requestUrl.pathname);
          
            if (request.method === "GET" && requestUrl.pathname === "/setup/deviantart") {
              return handleDeviantArtSetup(request, env);
            }
          
            if (request.method === "GET" && requestUrl.pathname === "/oauth/callback") {
              return handleDeviantArtCallback(request, env);
            }
          
            if (request.method === "GET" && requestUrl.pathname === "/debug/deviantart") {
              const report = await runDeviantArtDiagnostics(env);
              return json(report, report.ok ? 200 : 503);
            }
          
            if (request.method === "GET") {
              return new Response(
                "Furry Art Finder is online. Setup: /setup/deviantart Diagnostic: /debug/deviantart",
                { headers: { "content-type": "text/plain; charset=UTF-8" } },
              );
            }
          
              if (request.method !== "POST") {
                return new Response("Method Not Allowed", { status: 405 });
              }
          
              if (!env.DISCORD_PUBLIC_KEY) {
                console.error("DISCORD_PUBLIC_KEY is not configured");
                return new Response("Server is not configured", { status: 500 });
              }
          
              const signature = request.headers.get("x-signature-ed25519");
              const timestamp = request.headers.get("x-signature-timestamp");
              const rawBody = await request.text();
          
              if (!signature || !timestamp) {
                return new Response("Missing Discord signature", { status: 401 });
              }
          
              const valid = await verifyKey(rawBody, signature, timestamp, env.DISCORD_PUBLIC_KEY);
              if (!valid) {
                return new Response("Invalid request signature", { status: 401 });
              }
          
              let interaction;
              try {
                interaction = JSON.parse(rawBody);
              } catch {
                return new Response("Invalid JSON", { status: 400 });
              }
          
              if (interaction.type === INTERACTION.PING) {
                return json({ type: RESPONSE.PONG });
              }
          
              if (interaction.type === INTERACTION.APPLICATION_COMMAND) {
                return handleCommand(interaction, env);
              }
          
              if (interaction.type === INTERACTION.MESSAGE_COMPONENT) {
                return handleComponent(interaction, env);
              }
          
              return ephemeralMessage("Unsupported Discord interaction.");
            },
          };
          WORKER_EOF

          cat > scripts/register-commands.js <<'REGISTER_EOF'
          const applicationId = process.env.DISCORD_APPLICATION_ID;
          const botToken = process.env.DISCORD_BOT_TOKEN;
          const legacyGuildId = process.env.DISCORD_GUILD_ID?.trim();
          
          if (!applicationId || !botToken) {
            console.error(
              "Missing DISCORD_APPLICATION_ID or DISCORD_BOT_TOKEN. Add them as GitHub Actions secrets.",
            );
            process.exit(1);
          }
          
          const commands = [
            {
              name: "furry",
              type: 1,
              description: "Find safe furry artwork from any DM, group DM, or server",
              nsfw: false,
          
              // USER_INSTALL: the app is installed to a person's Discord account,
              // rather than being added as a member of a server.
              integration_types: [1],
          
              // GUILD, BOT_DM, PRIVATE_CHANNEL. PRIVATE_CHANNEL covers normal DMs
              // and group DMs where the app itself is not a participant.
              contexts: [0, 1, 2],
          
              options: [
                {
                  type: 3,
                  name: "query",
                  description: "Example: blue wolf forest, cute fox, or dragon armor",
                  required: true,
                  min_length: 2,
                  max_length: 60,
                },
              ],
            },
          ];
          
          async function putCommands(endpoint, commandList) {
            const response = await fetch(endpoint, {
              method: "PUT",
              headers: {
                Authorization: `Bot ${botToken}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(commandList),
            });
          
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`Discord command registration failed (${response.status}): ${body}`);
            }
          
            return body;
          }
          
          try {
            // User-install commands must be global commands.
            await putCommands(
              `https://discord.com/api/v10/applications/${applicationId}/commands`,
              commands,
            );
            console.log(
              "Registered /furry globally for User Install in servers, bot DMs, normal DMs, and group DMs.",
            );
          
            // If the old project had DISCORD_GUILD_ID configured, remove its obsolete
            // server-scoped command so Discord does not show two copies while testing.
            if (legacyGuildId) {
              await putCommands(
                `https://discord.com/api/v10/applications/${applicationId}/guilds/${legacyGuildId}/commands`,
                [],
              );
              console.log(`Removed legacy guild commands from ${legacyGuildId}.`);
            }
          } catch (error) {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          }
          REGISTER_EOF

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: npm run check

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Add Discord public key to Worker
        shell: bash
        run: printf '%s' "$DISCORD_PUBLIC_KEY" | npx wrangler secret put DISCORD_PUBLIC_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}

      - name: Add DeviantArt client ID to Worker
        shell: bash
        run: printf '%s' "$DEVIANTART_CLIENT_ID" | npx wrangler secret put DEVIANTART_CLIENT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEVIANTART_CLIENT_ID: ${{ secrets.DEVIANTART_CLIENT_ID }}

      - name: Add DeviantArt client secret to Worker
        shell: bash
        run: printf '%s' "$DEVIANTART_CLIENT_SECRET" | npx wrangler secret put DEVIANTART_CLIENT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEVIANTART_CLIENT_SECRET: ${{ secrets.DEVIANTART_CLIENT_SECRET }}

      - name: Add DeviantArt refresh token to Worker when configured
        shell: bash
        run: |
          if [ -n "$DEVIANTART_REFRESH_TOKEN" ]; then
            printf '%s' "$DEVIANTART_REFRESH_TOKEN" | npx wrangler secret put DEVIANTART_REFRESH_TOKEN
          else
            echo "DEVIANTART_REFRESH_TOKEN is not configured yet; use the Worker setup page after deployment."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEVIANTART_REFRESH_TOKEN: ${{ secrets.DEVIANTART_REFRESH_TOKEN }}

      - name: Register user-installed slash command
        run: npm run register
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          
